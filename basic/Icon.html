<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NN 规范 - Icon 图标</title>
  <link rel="stylesheet" href="../styles.css?v=20261119-din-balanced">
  <link rel="stylesheet" href="../iconfont/iconfont.css">
  <style>
    .icon-size-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: var(--space16);
      margin-bottom: var(--space32);
    }

    .icon-size-item {
      display: flex;
      align-items: center;
      gap: var(--space12);
      min-width: 0;
      padding: var(--space16);
      border: 1px solid var(--gray-8);
      border-radius: var(--border-radius-4r);
      background: var(--gray-2);
    }

    .icon-size-preview {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: var(--icon-demo-size);
      height: var(--icon-demo-size);
      flex: 0 0 auto;
      color: var(--Esports-Blue);
      font-size: var(--icon-demo-size);
      line-height: 1;
    }

    .icon-size-preview .nnicon {
      font-size: inherit;
      line-height: 1;
    }

    .icon-size-meta {
      display: flex;
      flex-direction: column;
      min-width: 0;
      gap: var(--space4);
    }

    .icon-size-token {
      color: var(--gray-3);
      font-family: var(--font-family-code);
      font-size: var(--font-size-body);
      line-height: var(--line-height-body);
      font-weight: var(--font-weight-normal);
    }

    .icon-size-value {
      color: var(--gray-6);
      font-size: var(--font-size-caption);
      line-height: var(--line-height-caption);
      font-weight: var(--font-weight-normal);
    }
  </style>
  <script>
    (function() {
      if (localStorage.getItem('dark-mode') === 'true') {
        document.body.classList.add('dark-mode');
      }
    })();
  </script>
</head>
<body>
  <iframe id="header-iframe" src="../public/public-header.html?v=20260604-equity-basic&library=basic" frameborder="0" style="width: 100%; height: var(--header-height); border: none; display: block; position: fixed; top: 0; left: 0; z-index: 1000;"></iframe>

  <iframe id="nav-iframe" src="../public/nav.html?v=20260729-icon-size-token" frameborder="0"></iframe>

  <div class="container" style="margin-top: var(--space60);">
    <section class="section">
      <span class="breadcrumb-part">通用</span><span class="breadcrumb-separator">/</span><span class="breadcrumb-part">图标</span>
      <h1 class="section-title">Icon 图标</h1>
      <p class="description">图标尺寸统一使用设计变量，组件内图标的 width、height、font-size 均应引用对应的 icon size token。</p>

      <div class="icon-size-grid" id="icon-size-grid"></div>

      <table class="token-table">
        <thead>
          <tr>
            <th>Token</th>
            <th>Value</th>
          </tr>
        </thead>
        <tbody id="icon-token-table"></tbody>
      </table>
    </section>
  </div>

  <script src="../main.js?v=20260525-clean"></script>
  <script>
    const iconSizeTokens = [
      ['--icon-size-x4', '8px'],
      ['--icon-size-x5', '10px'],
      ['--icon-size-x6', '12px'],
      ['--icon-size-x7', '14px'],
      ['--icon-size-x8', '16px'],
      ['--icon-size-x9', '18px'],
      ['--icon-size-x10', '20px'],
      ['--icon-size-x12', '24px'],
      ['--icon-size-x14', '28px'],
      ['--icon-size-x16', '32px'],
      ['--icon-size-x18', '36px'],
      ['--icon-size-x20', '40px'],
      ['--icon-size-x22', '44px'],
      ['--icon-size-x24', '48px'],
      ['--icon-size-x26', '52px'],
      ['--icon-size-x30', '60px'],
      ['--icon-size-x32', '64px'],
      ['--icon-size-x40', '80px']
    ];

    function createIconSizeItem(token, value) {
      const item = document.createElement('div');
      item.className = 'icon-size-item';
      item.style.setProperty('--icon-demo-size', `var(${token})`);
      item.innerHTML = `
        <span class="icon-size-preview"><i class="nnicon nicon-a-AcceleratedRocket-Linejiasuhuojian-xianxing"></i></span>
        <span class="icon-size-meta">
          <span class="icon-size-token">${token}</span>
          <span class="icon-size-value">${value}</span>
        </span>
      `;
      return item;
    }

    function createIconTokenRow(token, value) {
      const row = document.createElement('tr');
      row.innerHTML = `
        <td><span class="token-name">${token}</span></td>
        <td><span class="token-value">${value}</span></td>
      `;
      return row;
    }

    document.addEventListener('DOMContentLoaded', function() {
      const grid = document.getElementById('icon-size-grid');
      const table = document.getElementById('icon-token-table');
      iconSizeTokens.forEach(function(item) {
        grid.appendChild(createIconSizeItem(item[0], item[1]));
        table.appendChild(createIconTokenRow(item[0], item[1]));
      });
      setActiveNav('nav-icon');
    });
  </script>
</body>
</html>
