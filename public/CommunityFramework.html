<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NN 页面展示 - Community Framework 社区框架</title>
  <script>
    document.documentElement.classList.toggle('dark-mode', localStorage.getItem('dark-mode') === 'true');
  </script>
  <link rel="stylesheet" href="../styles.css?v=20261119-din-balanced">
  <link rel="stylesheet" href="../iconfont/iconfont.css?v=20261112-platform-icons">
  <link rel="stylesheet" href="../page/member-hall.css?v=20260921-message-responsive">
  <script src="../iconfont/iconfont.js?v=20260820-iconfont-4900344"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-width: 100%;
      min-height: 100vh;
      margin: var(--space0);
      background: var(--gray-1);
      color: var(--gray-3);
      font-family: var(--font-family-main);
      overflow: auto;
    }

    body.is-framework-expanded #nav-iframe {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    body.is-embed-preview {
      overflow: hidden;
    }

    body.is-embed-preview #header-iframe,
    body.is-embed-preview #nav-iframe {
      display: none !important;
    }

    body.is-embed-preview .community-framework-shell {
      min-width: 1280px;
      min-height: 900px;
      margin: var(--space0);
      padding: var(--space0);
    }

    body.is-embed-preview .section > .breadcrumb-part,
    body.is-embed-preview .section > .breadcrumb-separator,
    body.is-embed-preview .section > .section-title {
      display: none;
    }

    body.is-embed-preview .community-framework::after {
      display: none;
    }

    .community-framework-shell {
      min-width: 1280px;
      min-height: calc(100vh - 60px);
      margin: var(--space60) var(--space0) var(--space0) 260px;
      padding: var(--space40) var(--space60);
    }

    .community-framework-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 1280px;
      min-height: 900px;
      width: 100%;
    }

    .community-framework {
      --framework-menu-width: 70px;
      --framework-community-left: 70px;
      --framework-community-width: 296px;
      --framework-content-left: 366px;
      --framework-voice-height: 60px;
      --framework-motion-duration: 520ms;
      --framework-motion-ease: cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
      width: 1280px;
      height: 900px;
      min-width: 1280px;
      min-height: 900px;
      overflow: hidden;
      background: var(--gray-1);
      color: var(--gray-3);
    }

    .community-framework::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 120;
      box-shadow: inset 0 0 0 1px var(--gray-8);
      pointer-events: none;
    }

    .community-framework.is-menu-collapsed {
      --framework-community-left: 12px;
      --framework-community-width: 354px;
    }

    .community-framework.is-menu-collapsed.is-menu-hovered {
      --framework-community-left: 70px;
      --framework-community-width: 296px;
    }

    .community-framework.is-expanded {
      position: fixed;
      inset: 0;
      z-index: 2000;
      width: 100vw;
      height: 100vh;
      min-width: 0;
      min-height: 0;
      border-color: var(--gray-8);
    }

    .community-framework__header {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 30;
      width: 100%;
      height: 50px;
    }

    .community-framework__header .nn-header {
      width: 100% !important;
      padding-right: var(--space0);
      border-bottom-color: var(--gray-10);
    }

    .community-framework__menu {
      position: absolute;
      top: 50px;
      bottom: 0;
      left: 0;
      z-index: 25;
      width: var(--framework-menu-width);
      background: var(--gray-1);
      overflow: visible;
      transform: translateX(0);
      transition:
        transform var(--framework-motion-duration) var(--framework-motion-ease);
      will-change: transform;
    }

    .community-framework.is-menu-collapsed .community-framework__menu {
      pointer-events: none;
      transform: translateX(calc(-1 * var(--framework-menu-width)));
    }

    .community-framework.is-menu-collapsed.is-menu-hovered .community-framework__menu {
      pointer-events: auto;
      transform: translateX(0);
    }

    .community-framework__menu-hover-zone {
      position: absolute;
      top: 50px;
      bottom: 0;
      left: 0;
      z-index: 36;
      display: none;
      width: 70px;
      background: transparent;
    }

    .community-framework.is-menu-collapsed .community-framework__menu-hover-zone {
      display: block;
    }

    .community-framework.is-menu-collapsed.is-menu-hovered .community-framework__menu-hover-zone {
      z-index: 24;
      width: 70px;
    }

    .community-framework__menu .nn-menu {
      width: var(--framework-menu-width);
      height: 100%;
      min-height: 0;
      overflow: visible;
    }

    .community-framework__menu .nn-menu-list {
      transform: translateY(calc(-1 * var(--framework-menu-scroll-offset, 0px)));
      transition: transform 120ms ease;
      will-change: transform;
    }

    .community-framework__menu .nn-menu-list-wrapper,
    .community-framework__menu .nn-menu-list,
    .community-framework__menu .nn-menu-item {
      overflow: visible;
    }

    .community-framework__menu .nn-tooltip {
      z-index: 80;
      pointer-events: none;
    }

    .community-framework__community {
      position: absolute;
      top: 50px;
      bottom: 0;
      left: var(--framework-community-left);
      z-index: 8;
      width: var(--framework-community-width);
      background: var(--gray-1);
      overflow: hidden;
      transition:
        left var(--framework-motion-duration) var(--framework-motion-ease),
        width var(--framework-motion-duration) var(--framework-motion-ease);
      will-change: left, width;
    }

    .community-framework__community .nn-community-combo {
      width: 100%;
      min-width: 100%;
      height: 100%;
      max-height: none;
      transition:
        width var(--framework-motion-duration) var(--framework-motion-ease),
        min-width var(--framework-motion-duration) var(--framework-motion-ease);
    }

    .community-framework__community .nn-community-combo__scroller {
      height: 100%;
      min-width: 0;
      max-height: none;
      padding-bottom: var(--framework-voice-height);
    }

    .community-framework__voice {
      position: absolute;
      left: 0;
      bottom: 0;
      z-index: 40;
      display: flex;
      align-items: flex-end;
      overflow: visible;
    }

    .community-framework__voice .nn-voice-panel__top {
      max-height: 80px;
      opacity: 1;
      overflow: visible;
      transform: translateY(0);
      transition:
        max-height var(--framework-motion-duration) var(--framework-motion-ease),
        opacity 180ms ease,
        transform var(--framework-motion-duration) var(--framework-motion-ease),
        margin var(--framework-motion-duration) var(--framework-motion-ease);
    }

    .community-framework.is-voice-room-hidden .community-framework__voice .nn-voice-panel__top {
      max-height: 0;
      margin: calc(var(--space8) * -1) var(--space0) var(--space0);
      opacity: 0;
      overflow: hidden;
      pointer-events: none;
      transform: translateY(8px);
    }

    .community-framework__content {
      position: absolute;
      top: 50px;
      right: 0;
      bottom: 0;
      left: var(--framework-content-left);
      padding: var(--space0) var(--space8);
      background: var(--gray-1);
      box-sizing: border-box;
      transition: left var(--framework-motion-duration) var(--framework-motion-ease);
    }

    .community-framework-record {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: var(--space4) var(--space0) var(--space0);
      overflow: hidden;
      box-sizing: border-box;
    }

    .community-framework-record__tabs {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space12);
      width: calc(100% - 16px);
      max-width: 1200px;
      min-height: 38px;
      margin: var(--space0) auto var(--space4);
      padding-left: var(--space16);
      border-bottom: 1px solid var(--gray-10);
      box-sizing: border-box;
    }

    .community-framework-record__scroller {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
    }

    .community-framework-record__tabs > .nn-tabs {
      min-width: 0;
      position: relative;
      z-index: 1;
    }

    .community-framework-record__ranking-help {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: var(--space2);
      width: 76px;
      height: 24px;
      padding: var(--space4) var(--space6);
      border-radius: var(--border-radius-2r);
      background: var(--gray-9);
      color: var(--gray-6);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-normal);
      line-height: var(--line-height-caption);
      box-sizing: border-box;
      cursor: pointer;
      transition: color 160ms ease;
      white-space: nowrap;
    }

    .community-framework-record__ranking-help:hover {
      color: var(--gray-3);
    }

    .community-framework-record__ranking-help .nnicon {
      display: inline-flex;
      flex: 0 0 var(--icon-size-x7);
      width: var(--icon-size-x7);
      height: var(--icon-size-x7);
      font-size: var(--icon-size-x7);
      line-height: var(--icon-size-x7);
    }

    .community-framework-record__inner {
      display: grid;
      grid-template-columns: minmax(578px, 1fr) 280px;
      gap: var(--space24);
      align-items: start;
      width: calc(100% - 16px);
      max-width: 1200px;
      min-width: 882px;
      margin: var(--space12) auto var(--space0);
    }

    .community-framework-record__main,
    .community-framework-record__aside,
    .community-framework-record__stack,
    .community-framework-record__report-list {
      display: flex;
      flex-direction: column;
      gap: var(--space16);
      min-width: 0;
    }

    .community-framework-record__analysis {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space12);
    }

    .community-framework-record-card,
    .community-framework-record-table,
    .community-framework-record-broadcast {
      border: 1px solid var(--gray-8);
      border-radius: var(--border-radius-2r);
      background: var(--gray-1);
      box-sizing: border-box;
    }

    .community-framework-record-card {
      padding: var(--space20);
    }

    .community-framework-record__title {
      margin: var(--space0);
      color: var(--gray-3);
      font-family: var(--font-family-main);
      font-size: 18px;
      font-weight: var(--font-weight-semibold);
      line-height: 24px;
    }

    .community-framework-record-card__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space12);
      margin-bottom: var(--space16);
    }

    .community-framework-record-card__user {
      display: inline-flex;
      align-items: center;
      gap: var(--space8);
      min-width: 0;
      color: var(--gray-3);
      font-size: var(--font-size-subtitle);
      font-weight: var(--font-weight-semibold);
      line-height: var(--line-height-title);
    }

    .community-framework-record-card__link,
    .community-framework-record-card__refresh {
      display: inline-flex;
      align-items: center;
      gap: var(--space4);
      color: var(--gray-6);
      font-size: var(--font-size-body);
      line-height: var(--line-height-body);
      white-space: nowrap;
    }

    .community-framework-record-rank-card .community-framework-record-card__link {
      cursor: pointer;
    }

    .community-framework-record-rank-card .community-framework-record-card__link:hover {
      color: var(--gray-3);
    }

    .community-framework-record-card__refresh {
      padding: var(--space0);
      border: 0;
      background: var(--transparent);
      font: inherit;
      cursor: pointer;
    }

    .community-framework-record-card__refresh-icon {
      display: inline-flex;
      transform-origin: 50% 50%;
    }

    .community-framework-record-card__refresh.is-refreshing {
      pointer-events: none;
    }

    .community-framework-record-card__refresh.is-refreshing .community-framework-record-card__refresh-icon {
      animation: community-framework-record-refresh-spin 0.7s linear;
    }

    @keyframes community-framework-record-refresh-spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .community-framework-record-card__filters {
      display: flex;
      gap: var(--space12);
      margin-bottom: var(--space20);
    }

    .community-framework-record-filter {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      min-width: 96px;
      height: 36px;
      padding: var(--space8) var(--space12);
      border: 1px solid var(--gray-8);
      border-radius: var(--border-radius-2r);
      color: var(--gray-4);
      font-size: var(--font-size-body);
      line-height: var(--line-height-body);
      box-sizing: border-box;
    }

    .community-framework-record-card__body {
      display: grid;
      grid-template-columns: 190px minmax(0, 1fr);
      gap: var(--space20);
      align-items: center;
    }

    .community-framework-record-card__rank {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space8);
    }

    .community-framework-record-card__rank-img {
      display: block;
      width: 136px;
      height: 100px;
      object-fit: contain;
    }

    .community-framework-record-card__rank-img--dark {
      display: none;
    }

    body.dark-mode .community-framework-record-card__rank-img--light {
      display: none;
    }

    body.dark-mode .community-framework-record-card__rank-img--dark {
      display: block;
    }

    .community-framework-record-card__stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--space20) var(--space12);
    }

    .community-framework-record-stat {
      display: flex;
      flex-direction: column;
      gap: var(--space4);
      min-width: 0;
    }

    .community-framework-record-stat__label,
    .community-framework-record-table__meta,
    .community-framework-record-broadcast__room {
      color: var(--gray-6);
      font-size: var(--font-size-caption);
      line-height: var(--line-height-caption);
    }

    .community-framework-record-stat__value {
      color: var(--gray-3);
      font-family: var(--font-family-din);
      font-size: 24px;
      font-weight: var(--font-weight-bold);
      line-height: 30px;
    }

    .community-framework-record-mini {
      min-height: 220px;
      padding: var(--space16);
    }

    .community-framework-record-mini__chart {
      display: flex;
      align-items: end;
      gap: var(--space8);
      height: 132px;
      margin-top: var(--space16);
    }

    .community-framework-record-mini__bar {
      width: 24px;
      border-radius: var(--border-radius-2r) var(--border-radius-2r) var(--space0) var(--space0);
      background: var(--Esports-Blue-LD);
      opacity: var(--record-bar-opacity, 1);
    }

    .community-framework-record-weapon {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--space10);
      margin-top: var(--space16);
    }

    .community-framework-record-weapon__item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space6);
      min-width: 0;
      color: var(--gray-5);
      font-size: var(--font-size-caption);
      line-height: var(--line-height-caption);
    }

    .community-framework-record-weapon__icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: var(--border-radius-4r);
      background: var(--gray-10);
      color: var(--gray-4);
      font-size: var(--icon-size-x16);
    }

    .community-framework-record-table {
      --record-table-rank-column: 160px;
      --record-table-type-column: 142px;
      overflow: hidden;
    }

    @media (min-width: 1440px) {
      .community-framework-record-table {
        --record-table-rank-column: 230px;
        --record-table-type-column: 200px;
      }
    }

    body.is-record-standings-mode .community-framework-record-table {
      position: relative;
      z-index: 6;
      overflow: visible;
    }

    body.is-record-standings-mode .community-framework-record-table__row:first-child {
      position: sticky;
      top: var(--space0);
      z-index: 12;
      border-bottom: 1px solid var(--gray-8);
    }

    body.is-record-standings-mode .community-framework-record-table__row:nth-child(2) {
      border-top-color: transparent;
    }

    .community-framework-record-table__filter {
      width: auto;
    }

    .community-framework-record-table__filter.nn-dropdown.nn-dropdown-appearance-no-padding .nn-dropdown-text-stack {
      flex: 0 0 auto;
      padding-left: var(--space0);
    }

    .community-framework-record-table__filter .nn-dropdown-contents,
    .community-framework-record-table__filter .nn-dropdown-text,
    .community-framework-record-table__filter .nn-dropdown-value {
      flex: 0 0 auto;
    }

    .community-framework-record-table__filter .nn-dropdown-value {
      color: var(--gray-4);
      font-size: var(--font-size-body);
      font-weight: var(--font-weight-medium);
    }

    .community-framework-record-table__filter .nn-dropdown-icon-end {
      display: inline-flex;
      margin-left: var(--space4);
      padding: var(--space0);
    }

    .community-framework-record-table__filter .nn-dropdown-arrow {
      width: var(--icon-size-x8);
      height: var(--icon-size-x8);
      font-size: var(--icon-size-x8);
    }

    .community-framework-record-table__filter .nn-dropdown-panel {
      z-index: 30;
      width: 132px;
    }

    .community-framework-record-table__row {
      display: grid;
      grid-template-columns: var(--record-table-rank-column) var(--record-table-type-column) repeat(3, minmax(0, 1fr));
      align-items: center;
      height: 60px;
      border-top: 1px solid var(--gray-10);
    }

    .community-framework-record-table__row:first-child {
      height: 40px;
      border-top: 0;
      background: var(--gray-10);
    }

    .community-framework-record-table__row:nth-child(2) {
      border-top-color: var(--gray-8);
    }

    .community-framework-record-table__row:not(:first-child) {
      transition: background-color 120ms ease;
    }

    .community-framework-record-table__row:not(:first-child):hover {
      background: var(--gray-10);
    }

    .community-framework-record-table__row[hidden] {
      display: none;
    }

    .community-framework-record-table__cell {
      min-width: 0;
      padding: var(--space0) var(--space12);
      color: var(--gray-4);
      font-size: var(--font-size-body);
      font-weight: var(--font-weight-normal);
      line-height: var(--line-height-body);
      box-sizing: border-box;
    }

    .community-framework-record-table__cell:nth-child(1) {
      max-width: 230px;
    }

    .community-framework-record-table__cell:nth-child(2) {
      max-width: 200px;
    }

    .community-framework-record-table__row:not(:first-child) .community-framework-record-table__cell:first-child {
      padding-left: var(--space16);
    }

    .community-framework-record-table__row:first-child .community-framework-record-table__cell {
      color: var(--gray-4);
      font-size: var(--font-size-body);
      font-weight: var(--font-weight-medium);
      line-height: var(--line-height-body);
    }

    .community-framework-record-table__row:first-child .community-framework-record-table__cell:first-child {
      padding-left: var(--space16);
    }

    .community-framework-record-table__place {
      display: inline-flex;
      align-items: center;
      color: var(--gray-5);
      font-family: var(--font-family-din);
      font-weight: var(--font-weight-bold);
      line-height: 28px;
      white-space: nowrap;
    }

    .community-framework-record-table__place-copy {
      display: inline-flex;
      align-items: baseline;
      width: 60px;
      gap: var(--space4);
    }

    .community-framework-record-table__place-rank {
      color: inherit;
      font-size: 22px;
    }

    .community-framework-record-table__place--winner .community-framework-record-table__place-rank {
      color: var(--Record-Match-Winner);
    }

    .community-framework-record-table__place--runner-up .community-framework-record-table__place-rank {
      color: var(--Record-Match-Runner-Up);
    }

    .community-framework-record-table__place--third-place .community-framework-record-table__place-rank {
      color: var(--Record-Match-Third-Place);
    }

    .community-framework-record-table__place-separator,
    .community-framework-record-table__place-total {
      color: var(--gray-7);
      font-size: var(--font-size-subtitle);
    }

    .community-framework-record-table__place-honor {
      display: inline-flex;
      align-items: center;
      gap: var(--space2);
      height: 20px;
      color: var(--gray-6);
      font-family: var(--font-family-main);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-normal);
      line-height: var(--line-height-caption);
    }

    .community-framework-record-table__place-honor .nnicon {
      font-size: 18px;
      line-height: 18px;
    }

    .community-framework-record-table__place--winner .community-framework-record-table__place-honor {
      color: var(--Record-Match-Winner);
    }

    .community-framework-record-table__place--runner-up .community-framework-record-table__place-honor .nnicon {
      color: var(--Record-Match-Runner-Up);
    }

    .community-framework-record-table__place--third-place .community-framework-record-table__place-honor .nnicon {
      color: var(--Record-Match-Third-Place);
    }

    .community-framework-record-table__meta {
      display: block;
      color: var(--gray-6);
      font-size: var(--font-size-label);
      font-weight: var(--font-weight-normal);
      line-height: var(--line-height-label);
    }

    .community-framework-record-table__type {
      display: block;
      margin-top: var(--space2);
      color: var(--gray-4);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
      line-height: var(--line-height-caption);
    }

    .community-framework-record-table__number {
      color: var(--gray-6);
      font-family: var(--font-family-din);
      font-size: var(--font-size-subtitle);
      font-weight: var(--font-weight-bold);
      line-height: var(--line-height-body);
    }

  <script>
    if (new URLSearchParams(window.location.search).get('embed') === '1') {
      document.body.classList.add('is-embed-preview');
    }

    document.addEventListener('DOMContentLoaded', function() {
      setActiveNav('p-nav-community-framework');

      const framework = document.getElementById('community-framework');
      const headerSlot = document.getElementById('framework-header');
      const menuSlot = document.getElementById('framework-menu');
      const menuHoverZone = document.getElementById('framework-menu-hover-zone');
      const communitySlot = document.getElementById('framework-community');
      const voiceSlot = document.getElementById('framework-voice');
      const contentSlot = framework.querySelector('.community-framework__content');
      const urlParams = new URLSearchParams(window.location.search);
      const isRecordStandingsMode = urlParams.get('mode') === 'record-standings';
      const isMemberHallMode = urlParams.get('mode') === 'member-hall';
      const isGameDetailMode = urlParams.get('mode') === 'game-detail';
      if (isMemberHallMode) document.body.classList.add('is-member-hall-mode');
      if (isGameDetailMode) document.body.classList.add('is-game-detail-mode');
      const fullscreenMessageType = isMemberHallMode
        ? 'member-hall-framework-fullscreen'
        : (isGameDetailMode ? 'game-detail-framework-fullscreen' : 'record-framework-fullscreen');

      if (isRecordStandingsMode) {
        document.body.classList.add('is-record-standings-mode');
      }

      function syncDarkMode(isDark) {
        localStorage.setItem('dark-mode', String(isDark));
        document.documentElement.classList.toggle('dark-mode', isDark);
        document.body.classList.toggle('dark-mode', isDark);
        notifyIframeDarkMode(isDark);
        document.dispatchEvent(new CustomEvent('community-framework-theme-change', {
          detail: { isDark: isDark }
        }));
      }

      function toggleDarkMode() {
        syncDarkMode(!document.body.classList.contains('dark-mode'));
      }

      function toggleExpanded() {
        const isExpanded = framework.classList.toggle('is-expanded');
        document.body.classList.toggle('is-framework-expanded', isExpanded);
        if ((isRecordStandingsMode || isMemberHallMode || isGameDetailMode) && window.parent && window.parent !== window) {
          window.parent.postMessage({
            type: fullscreenMessageType,
            value: isExpanded
          }, '*');
        }
      }

      if (isRecordStandingsMode || isMemberHallMode || isGameDetailMode) {
        window.addEventListener('message', function(event) {
          if (event.source !== window.parent || !event.data || event.data.type !== fullscreenMessageType || event.data.value !== false) return;
          if (framework.classList.contains('is-expanded')) toggleExpanded();
        });

        document.addEventListener('keydown', function(event) {
          if (event.key === 'Escape' && framework.classList.contains('is-expanded')) {
            toggleExpanded();
          }
        });
      }

      const header = createHeader({
        width: '100%',
        showBack: true
      });
      headerSlot.appendChild(header);

      const windowIcons = header.querySelectorAll('.nn-header__window-icon');
      if (windowIcons[1]) {
        windowIcons[1].setAttribute('role', 'button');
        windowIcons[1].setAttribute('tabindex', '0');
        windowIcons[1].setAttribute('aria-label', '适配浏览器最大尺寸');
        windowIcons[1].addEventListener('click', toggleExpanded);
        windowIcons[1].addEventListener('keydown', function(event) {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            toggleExpanded();
          }
        });
      }

      menuSlot.appendChild(createInteractiveMenu({
        selectedItemIndex: isGameDetailMode ? 1 : -1,
        lockItemSelection: isGameDetailMode
      }));

      communitySlot.appendChild(createCommunityNavigationCombo({
        communityType: 'game',
        activePluginTitle: isRecordStandingsMode ? '战绩·排名' : (isMemberHallMode ? '全员大厅' : ''),
        ...(isMemberHallMode ? {
          top: { imageSrc: memberHallAssets['banner.png'] },
          showLevel: false,
          game: { title: '绝地求生首页', showBadge: false, showSettings: false },
          plugins: [
            { title: 'PUBG福利商店', icon: 'nicon-a-intearal-filljifen-mianxing', showInfo: false, showBadge: false },
            { title: '全员大厅', info: '欢迎来到英雄联盟社区，请先查看社区公告', badge: '8', showAvatar: false },
            {
              title: '战绩·排名',
              icon: 'nicon-a-Grouping-Linezudui-xianxing',
              activeIcon: 'nicon-a-Grouping-Fillzudui-mianxing',
              info: '那瑟摩萨  吃鸡了',
              showBadge: false
            },
            { title: '赛事专区', icon: 'nicon-a-Competition-linesaishishouye-xianxing', showInfo: false, showBadge: false },
            { title: 'PNCL选拔赛', icon: 'nicon-a-trophy-linejiangbei-xianxing', showInfo: false, showBadge: false },
            { title: '发现', icon: 'nicon-a-Posts-linetiezi-xianxing', showInfo: false, showBadge: false },
            { title: 'PUBG工具', icon: 'nicon-a-Gametools-lineyouxigongju-xianxing', showInfo: false, showBadge: false },
            { title: 'UGC地图工坊', icon: 'nicon-a-MapWorkshop-Lineditugongfang-xianxing', showInfo: false, showBadge: false },
            { title: '旗下社区', icon: 'nicon-a-BattleTeam-Linezhandui-xianxing', showInfo: false, showBadge: false, showAvatarGroup: true }
          ]
        } : {}),
        ...(isGameDetailMode ? {
          game: { title: '绝地求生首页', showBadge: false }
        } : {})
      }));
      if (isMemberHallMode) contentSlot.appendChild(createMemberHall());
      let gamePurchaseActionController = null;
      let allowVoicePanelInternalLaunchAction = false;
      const voicePanel = createVoicePanel({
        launchState: 'idle',
        onLaunchAction: function(payload) {
          if (!isGameDetailMode || allowVoicePanelInternalLaunchAction || typeof gamePurchaseActionController !== 'function') {
            return;
          }
          gamePurchaseActionController(payload);
          return false;
        }
      });
      voiceSlot.appendChild(voicePanel);

      if (isGameDetailMode && contentSlot) {
        const gameDetail = document.createElement('div');
        gameDetail.className = 'community-framework-game-detail';
        gameDetail.innerHTML = `
          <div class="community-framework-game-detail__inner" data-nn-header-align>
            <div class="community-framework-game-detail__toolbar">
              <div id="framework-game-detail-tabs"></div>

        if (nextOffset === frameworkMenuScrollOffset) return false;
        frameworkMenuScrollOffset = nextOffset;
        framework.style.setProperty('--framework-menu-scroll-offset', `${frameworkMenuScrollOffset}px`);

      }

      if (window.ResizeObserver) {
        const voiceResizeObserver = new ResizeObserver(syncFrameworkVoiceHeight);
        voiceResizeObserver.observe(voiceSlot);
        voiceResizeObserver.observe(voicePanel);
        if (menuList) voiceResizeObserver.observe(menuList);
        if (menuListWrapper) voiceResizeObserver.observe(menuListWrapper);
      }

      syncFrameworkVoiceHeight();

      const leaveVoiceButton = voicePanel.querySelector('.nn-voice-panel__leave');
      if (leaveVoiceButton) {
        leaveVoiceButton.addEventListener('click', hideVoiceRoomInfo);
      }

      const firstVoiceRoom = communitySlot.querySelector('.nn-community-room');
      if (firstVoiceRoom) {
        firstVoiceRoom.addEventListener('click', showVoiceRoomInfo);
      }

      if (menuListWrapper) {
        menuListWrapper.addEventListener('wheel', function(event) {
          if (scrollFrameworkMenu(event.deltaY)) {
            event.preventDefault();
          }
        }, { passive: false });
      }

      voiceSlot.addEventListener('wheel', function(event) {
        if (event.target.closest('.nn-slider, input, textarea, select, [contenteditable="true"], .nn-voice-mode__settings-popover')) return;
        const menuRect = menuSlot.getBoundingClientRect();
        const communityRect = communitySlot.getBoundingClientRect();

        if (event.clientX >= menuRect.left && event.clientX <= menuRect.right) {
          if (scrollFrameworkMenu(event.deltaY)) {
            event.preventDefault();
          }
          return;
        }

        if (!communityScroller) return;
        if (event.clientX < communityRect.left || event.clientX > communityRect.right) return;

        const previousScrollTop = communityScroller.scrollTop;
        communityScroller.scrollTop += event.deltaY;
        if (communityScroller.scrollTop !== previousScrollTop) {
          event.preventDefault();
        }
      }, { passive: false });

      const voiceBack = voicePanel.querySelector('.nn-voice-panel__back');
      let restoreMenuTimer = null;
      let restoreEndTimer = null;
      let menuHoverTimer = null;
      let isMenuPointerInside = false;

      function clearMenuRestoreTimers() {
        if (restoreMenuTimer) {
          window.clearTimeout(restoreMenuTimer);
          restoreMenuTimer = null;
        }
        if (restoreEndTimer) {
          window.clearTimeout(restoreEndTimer);
          restoreEndTimer = null;
        }
      }

      function clearMenuHoverTimer() {
        if (menuHoverTimer) {
          window.clearTimeout(menuHoverTimer);
          menuHoverTimer = null;
        }
      }

      function showCollapsedMenuPreview() {
        if (!framework.classList.contains('is-menu-collapsed')) return;
        clearMenuHoverTimer();
        framework.classList.remove('is-menu-hovered');
        void framework.offsetWidth;
        framework.classList.add('is-menu-hovered');
      }

      function scheduleCollapsedMenuHide() {
        clearMenuHoverTimer();
        menuHoverTimer = window.setTimeout(function() {
          if (!isMenuPointerInside) {
            framework.classList.remove('is-menu-hovered');
          }
          menuHoverTimer = null;
        }, 80);
      }

      if (menuHoverZone) {
        menuHoverZone.addEventListener('mouseenter', function() {
          showCollapsedMenuPreview();
        });

        menuHoverZone.addEventListener('mouseleave', function() {
          scheduleCollapsedMenuHide();
        });
      }

      document.addEventListener('mousemove', function(event) {
        if (!framework.classList.contains('is-menu-collapsed') || !framework.classList.contains('is-menu-hovered')) return;
        const frameworkRect = framework.getBoundingClientRect();
        const isInsideVerticalRange = event.clientY >= frameworkRect.top + 50 && event.clientY <= frameworkRect.bottom;
        const isInsideLeaveZone = event.clientX >= frameworkRect.left && event.clientX <= frameworkRect.left + 70;
        if (!isInsideVerticalRange || !isInsideLeaveZone) {
          isMenuPointerInside = false;
          framework.classList.remove('is-menu-hovered');
        }
      });

      menuSlot.addEventListener('mouseenter', function() {
        isMenuPointerInside = true;
        showCollapsedMenuPreview();
      });

      menuSlot.addEventListener('mouseleave', function() {
        isMenuPointerInside = false;
        scheduleCollapsedMenuHide();
      });

      if (voiceBack) {
        voiceBack.addEventListener('click', function() {
          if (framework.classList.contains('is-menu-collapsed')) {
            clearMenuRestoreTimers();
            clearMenuHoverTimer();
            framework.classList.remove('is-menu-hovered');
            framework.classList.add('is-menu-restoring');

            restoreMenuTimer = window.setTimeout(function() {
              framework.classList.remove('is-menu-collapsed');
              restoreMenuTimer = null;
            }, 80);

            restoreEndTimer = window.setTimeout(function() {
              framework.classList.remove('is-menu-restoring');
              restoreEndTimer = null;
            }, 360);
            return;
          }

          clearMenuRestoreTimers();
          clearMenuHoverTimer();
          framework.classList.remove('is-menu-restoring');
          framework.classList.remove('is-menu-hovered');
          framework.classList.add('is-menu-collapsed');
        });
      }
    });
  </script>
</body>
</html>
