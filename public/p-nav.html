  <script>
    function applyInit(data) {
      document.documentElement.classList.toggle('dark-mode', Boolean(data.darkMode));
      document.body.classList.toggle('dark-mode', Boolean(data.darkMode));

      if (data.activeNavId) {
        document.querySelectorAll('.nav-list a.active').forEach(function(link) {
          link.classList.remove('active');
        });

        var activeLink = document.getElementById(data.activeNavId);
        if (activeLink) {
          activeLink.classList.add('active');
        }
      }
    }

    function applyDarkMode(isDark) {
      document.documentElement.classList.toggle('dark-mode', Boolean(isDark));
      document.body.classList.toggle('dark-mode', Boolean(isDark));
    }

    function saveScrollPosition() {
      var nav = document.querySelector('.nav-content');
      if (nav) {
        sessionStorage.setItem('p-nav-scrollTop', nav.scrollTop);
      }
    }

    function restoreScrollPosition() {
      var nav = document.querySelector('.nav-content');
      if (!nav) return;

      var savedPosition = sessionStorage.getItem('p-nav-scrollTop');
      if (savedPosition !== null) {
        nav.scrollTop = parseInt(savedPosition, 10);
      }
      updateNavFadeState();
    }

    function updateNavFadeState() {
      var nav = document.querySelector('.nav');
      var content = document.querySelector('.nav-content');
      if (!nav || !content) return;

      var maxScrollTop = Math.max(0, content.scrollHeight - content.clientHeight);
      nav.classList.toggle('is-scroll-top', content.scrollTop > 0);
      nav.classList.toggle('is-scroll-bottom', content.scrollTop < maxScrollTop - 1);
    }

    window.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'init') {
        applyInit(e.data);
        restoreScrollPosition();
      } else if (e.data && e.data.type === 'dark-mode') {
        applyDarkMode(e.data.value);
      }
    });

    (function() {
      if (localStorage.getItem('dark-mode') === 'true') {
        document.documentElement.classList.add('dark-mode');
        document.body.classList.add('dark-mode');
      }
      restoreScrollPosition();
      updateNavFadeState();
      var navContent = document.querySelector('.nav-content');
      if (navContent) {
        navContent.addEventListener('scroll', updateNavFadeState, { passive: true });
      }
      window.addEventListener('resize', updateNavFadeState);
    })();

    window.addEventListener('beforeunload', saveScrollPosition);
  </script>
