    <section class="section">

      <p class="description">展示账号资产、排名、游戏推荐和心愿单。</p>

          <header class="accelerator-home-frame__header" id="accelerator-home-header"></header>

            <div class="accelerator-home-frame__content" role="main">

                  <div class="accelerator-home-steam-wrap">
                    <div id="accelerator-home-carousel-restore"></div>
                    <div id="accelerator-home-steam"></div>
                  </div>
                </section>

                  <div class="accelerator-home-store-panel" id="accelerator-home-store-recommendations">

                    <p class="accelerator-home-store-search-status" id="accelerator-home-store-search-status" role="status" hidden>未找到相关游戏</p>
                  </div>
                  <div class="accelerator-home-store-panel" id="accelerator-home-store-wishlist" hidden>
                    <div class="accelerator-home-card-grid" id="accelerator-home-wishlist-grid"></div>
                  </div>
                </section>
              </div>
            </div>
            <div class="accelerator-home-frame__account-management" id="accelerator-home-account-management" role="main" hidden></div>
          </div>
        </div>
      </div>
    </section>
