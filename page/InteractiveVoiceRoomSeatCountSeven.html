<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NN 页面展示 - Interactive Voice Room 互动语音房</title>
  <script src="../preview-mode-bootstrap.js?v=20261030-preview-persist"></script>
  <link rel="stylesheet" href="../styles.css?v=20261119-din-balanced">
  <link rel="stylesheet" href="../iconfont/iconfont.css?v=20261111-launch-update-icons">
  <script src="../iconfont/iconfont.js"></script>
  <script>
    if (new URLSearchParams(window.location.search).get('embed') === '1') {
      document.documentElement.classList.add('is-embedded');
    }
    document.documentElement.classList.toggle('dark-mode', localStorage.getItem('dark-mode') === 'true');
  </script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-width: 100%;
      min-height: 100vh;
      margin: var(--space0);
      overflow: auto;
      background: var(--gray-1);
      color: var(--gray-3);
      font-family: var(--font-family-main);
    }

    body.is-interactive-voice-expanded #nav-iframe {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .interactive-voice-shell {
      min-width: 1280px;
      min-height: calc(100vh - 60px);
      margin: var(--space60) var(--space0) var(--space0) 260px;
      padding: var(--space40) var(--space60);
    }

    .interactive-voice-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-width: 1280px;
      min-height: 900px;
    }

    .is-embedded body {
      overflow: hidden;
      background: transparent;
    }

    .is-embedded #nav-iframe,
    .is-embedded #header-iframe,
    .is-embedded .breadcrumb-part,
    .is-embedded .breadcrumb-separator,
    .is-embedded .section-title {
      display: none !important;
    }

    .is-embedded .interactive-voice-shell {
      min-height: 900px;
      margin: var(--space0);
      padding: var(--space0);
    }

    .community-framework {
      --interactive-voice-content-edge-fade-width: 120px;
      --interactive-voice-chat-bottom-fade-height: 148px;
      --framework-menu-width: 70px;
      --framework-community-left: 70px;
      --framework-community-width: 296px;
      --framework-content-left: 366px;
      --framework-voice-height: 60px;
      --framework-motion-duration: 520ms;
      --framework-motion-ease: cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
      width: 1280px;
      height: 900px;
      min-width: 1280px;
      min-height: 900px;
      overflow: hidden;
      border: 1px solid var(--gray-8);
      background: var(--gray-1);
      color: var(--gray-3);
    }

    .community-framework.is-menu-collapsed {
      --framework-community-left: 12px;
      --framework-community-width: 354px;
    }

    .community-framework.is-menu-collapsed.is-menu-hovered {
      --framework-community-left: 70px;
      --framework-community-width: 296px;
    }

    .community-framework.is-expanded {
      position: fixed;
      inset: 0;
      z-index: 2000;
      width: 100vw;
      height: 100vh;
      min-width: 0;
      min-height: 0;
    }

    .community-framework__header {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 30;
      width: 100%;
      height: 50px;
    }

    .community-framework__header .nn-header {
      width: 100% !important;
      padding-right: var(--space0);
      border-bottom-color: var(--gray-10);
    }

    .community-framework__menu {
      position: absolute;
      top: 50px;
      bottom: 0;
      left: 0;
      z-index: 25;
      width: var(--framework-menu-width);
      overflow: visible;
      background: var(--gray-1);
      transform: translateX(0);
      transition: transform var(--framework-motion-duration) var(--framework-motion-ease);
      will-change: transform;
    }

    .community-framework.is-menu-collapsed .community-framework__menu {
      pointer-events: none;
      transform: translateX(calc(-1 * var(--framework-menu-width)));
    }

    .community-framework.is-menu-collapsed.is-menu-hovered .community-framework__menu {
      pointer-events: auto;
      transform: translateX(0);
    }

    .community-framework__menu-hover-zone {
      position: absolute;
      top: 50px;
      bottom: 0;
      left: 0;
      z-index: 36;
      display: none;
      width: 70px;
      background: transparent;
    }

    .community-framework.is-menu-collapsed .community-framework__menu-hover-zone {
      display: block;
    }

    .community-framework.is-menu-collapsed.is-menu-hovered .community-framework__menu-hover-zone {
      z-index: 24;
      width: 70px;
    }

    .community-framework__menu .nn-menu {
      width: var(--framework-menu-width);
      height: 100%;
      min-height: 0;
      overflow: visible;
    }

    .community-framework__menu .nn-menu-list {
      transform: translateY(calc(-1 * var(--framework-menu-scroll-offset, 0px)));
      transition: transform 120ms ease;
      will-change: transform;
    }

    .community-framework__menu .nn-menu-list-wrapper,
    .community-framework__menu .nn-menu-list,
    .community-framework__menu .nn-menu-item {
      overflow: visible;
    }

    .community-framework__menu .nn-tooltip {
      z-index: 80;
      pointer-events: none;
    }

    .community-framework__community {
      position: absolute;
      top: 50px;
      bottom: 0;
      left: var(--framework-community-left);
      z-index: 8;
      width: var(--framework-community-width);
      overflow: hidden;
      background: var(--gray-1);
      transition:
        left var(--framework-motion-duration) var(--framework-motion-ease),
        width var(--framework-motion-duration) var(--framework-motion-ease);
      will-change: left, width;
    }

    .community-framework__community .nn-community-combo {
      width: 100%;
      min-width: 100%;
      height: 100%;
      max-height: none;
      transition:
        width var(--framework-motion-duration) var(--framework-motion-ease),
        min-width var(--framework-motion-duration) var(--framework-motion-ease);
    }

    .community-framework__community .nn-community-combo__scroller {
      height: 100%;
      min-width: 0;
      max-height: none;
      padding-bottom: var(--framework-voice-height);
    }

    .community-framework__content {
      position: absolute;
      top: 50px;
      right: 0;
      bottom: 0;
      left: var(--framework-content-left);
      z-index: 5;
      overflow: hidden;
      padding: var(--space0) var(--space0) var(--space0) var(--space8);
      background: transparent;
      transition: left var(--framework-motion-duration) var(--framework-motion-ease);
    }

    .community-framework__content::before {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 1;
      width: var(--interactive-voice-content-edge-fade-width);
      background: linear-gradient(90deg, var(--gray-1) 0%, var(--transparent) 100%);
      content: "";
      pointer-events: none;
    }

    .community-framework__voice {
      position: absolute;
      left: 0;
      bottom: 0;
      z-index: 40;
      display: flex;
      align-items: flex-end;
      overflow: visible;
    }

    .community-framework__voice .nn-voice-panel__top {
      max-height: 80px;
      opacity: 0.6;
      overflow: visible;
      transform: translateY(0);
      transition:
        max-height var(--framework-motion-duration) var(--framework-motion-ease),
        opacity 180ms ease,
        transform var(--framework-motion-duration) var(--framework-motion-ease),
        margin var(--framework-motion-duration) var(--framework-motion-ease);
    }

    .community-framework.is-voice-room-hidden .community-framework__voice .nn-voice-panel__top {
      max-height: 0;
      margin: calc(var(--space8) * -1) var(--space0) var(--space0);
      opacity: 0;
      overflow: hidden;
      pointer-events: none;
      transform: translateY(8px);
    }

    .community-framework__menu-arrow {
      position: absolute;
      top: 50%;
      left: 0;
      z-index: 23;
      width: 28px;
      height: 76px;
      pointer-events: none;
      opacity: 0;
      transform: translate(0, -50%);
    }

    .community-framework.is-menu-collapsed .community-framework__menu-arrow,
    .community-framework.is-menu-collapsed.is-menu-hovered .community-framework__menu-arrow,
    .community-framework.is-menu-restoring .community-framework__menu-arrow {
      opacity: 1;
    }

    .community-framework__menu-arrow-img {
      position: absolute;
      top: 0;
      left: 0;
      display: block;
      width: auto;
      height: 76px;
      object-fit: contain;
      transform-origin: left center;
      opacity: 0;
      transform: translateX(-30px);
      will-change: transform, opacity;
    }

    .community-framework__menu-arrow-img--light-1 {
      width: 24px;
    }

    .community-framework__menu-arrow-img--light-2 {
      width: 22px;
    }

    .community-framework__menu-arrow-img--dark {
      display: none;
    }

    body.dark-mode .community-framework__menu-arrow-img--light {
      display: none;
    }

    body.dark-mode .community-framework__menu-arrow-img--dark {
      display: block;
    }

    .community-framework.is-menu-collapsed .community-framework__menu-arrow-img--light-1 {
      animation: framework-menu-arrow-light-1-first 3000ms linear both;
    }

    .community-framework.is-menu-collapsed .community-framework__menu-arrow-img--light-2 {
      animation: framework-menu-arrow-light-2-first 3000ms linear both;
    }

    .community-framework.is-menu-collapsed .community-framework__menu-arrow-img--light-1-repeat {
      animation: framework-menu-arrow-light-1-repeat 3000ms linear both;
    }

    .community-framework.is-menu-collapsed .community-framework__menu-arrow-img--light-2-repeat {
      animation: framework-menu-arrow-light-2-repeat 3000ms linear both;
    }

    .community-framework.is-menu-collapsed.is-menu-hovered .community-framework__menu-arrow-img,
    .community-framework.is-menu-restoring .community-framework__menu-arrow-img {
      animation: framework-menu-arrow-light-exit 280ms cubic-bezier(0.4, 0, 1, 1) both;
    }

    .interactive-voice-content {
      position: relative;
      z-index: 2;
      isolation: isolate;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: transparent;
    }

    .interactive-voice-tooltip-layer {
      position: absolute;
      inset: var(--space0);
      z-index: 3000;
      overflow: visible;
      pointer-events: none;
    }

    .interactive-voice-tooltip-layer .nn-tooltip.nn-tooltip-top,
    .interactive-voice-tooltip-layer .nn-tooltip.nn-tooltip-bottom {
      position: absolute;
      top: auto;
      right: auto;
      bottom: auto;
      left: auto;
      display: none;
      gap: var(--space8);
      margin: var(--space0);
      transform: translateX(-50%);
      pointer-events: auto;
    }

    .interactive-voice-tooltip-layer .nn-tooltip.is-visible {
      display: inline-flex;
      animation: nn-tooltip-appear 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .interactive-voice-tooltip-layer .interactive-voice-wealth-title-tooltip.nn-tooltip {
      width: 320px;
      white-space: normal;
    }

    .interactive-voice-tooltip-layer .interactive-voice-wealth-title-tooltip .nn-tooltip-text {
      flex-shrink: 1;
      overflow-wrap: break-word;
      white-space: normal;
    }

    .interactive-voice-tooltip-layer .interactive-voice-wealth-title-tooltip.nn-tooltip-bottom .nn-tooltip-beak {
      left: var(--wealth-title-tooltip-beak-left, 50%);
    }

    .interactive-voice-wealth-modal-layer {
      position: absolute;
      inset: var(--space0);
      z-index: 120;
      display: none;
      align-items: center;
      justify-content: center;
      background: var(--mask);
    }

    .interactive-voice-wealth-modal-layer.is-open {
      display: flex;
    }

    .interactive-voice-gift-layer {
      position: absolute;
      right: var(--space0);
      bottom: var(--space0);
      left: var(--framework-content-left);
      z-index: 120;
      height: 144px;
      overflow: visible;
      pointer-events: none;
    }

    .interactive-voice-gift-layer.is-open {
      pointer-events: auto;
    }

    .interactive-voice-gift-drawer {
      position: absolute;
      right: var(--space0);
      bottom: var(--space0);
      left: var(--space0);
      display: flex;
      align-items: flex-end;
      width: auto;
      height: 144px;
      padding: var(--space0) var(--space12);
      border-top: 1px solid var(--gray-8);
      background: var(--gray-1);
      clip-path: inset(-260px 0 0 100%);
      opacity: 0;
      will-change: clip-path, opacity;
      transition:
        clip-path var(--framework-motion-duration) var(--framework-motion-ease),
        opacity var(--framework-motion-duration) var(--framework-motion-ease);
      box-sizing: border-box;
    }

    .interactive-voice-gift-layer.is-open .interactive-voice-gift-drawer {
      clip-path: inset(-260px 0 0 0);
      opacity: 1;
    }

    .interactive-voice-gift-drawer .nn-gift {
      width: 100%;
      max-width: none;
      height: 128px;
      background: transparent;
    }

    .interactive-voice-gift-drawer .nn-gift__main {
      justify-content: flex-start;
    }

    .interactive-voice-wealth-dialog.nn-toast {
      width: 800px;
      max-height: 796px;
      overflow-x: hidden;
      overflow-y: hidden;
    }

    .interactive-voice-wealth-dialog .nn-toast__content {
      color: var(--gray-3);
    }

    .interactive-voice-wealth-dialog .nn-toast__title-row {
      gap: var(--space4);
    }

    .interactive-voice-wealth-dialog.is-wealth-scrollable {
      overflow-y: auto;
    }

    .interactive-voice-wealth-dialog:not(.is-wealth-scrollable) > .nn-scrollbar {
      display: none;
    }

    .interactive-voice-wealth-content {
      display: flex;
      flex-direction: column;
      gap: var(--space24);
      width: 100%;
      min-width: 0;
    }

    .interactive-voice-wealth-progress {
      display: flex;
      align-items: center;
      gap: var(--space12);
      min-height: 98px;
      padding: var(--space16);
      border: 1px solid var(--gray-9);
      border-radius: var(--border-radius-4r);
      background: transparent;
    }

    .interactive-voice-wealth-progress__main {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      gap: var(--space12);
      min-width: 0;
    }

    .interactive-voice-wealth-progress__level {
      display: flex;
      align-items: center;
      gap: var(--space12);
      color: var(--gray-4);
      font-size: var(--font-size-header-1);
      font-weight: var(--font-weight-semibold);
      line-height: var(--line-height-header-1);
    }

    .interactive-voice-wealth-progress__badge {
      width: auto;
      height: 30px;
      object-fit: contain;
    }

    .interactive-voice-wealth-progress__row {
      display: flex;
      align-items: center;
      gap: var(--space8);
      min-width: 0;
      color: var(--gray-6);
      font-size: var(--font-size-body);
      line-height: var(--line-height-body);
    }

    .interactive-voice-wealth-progress__track {
      position: relative;
      width: 225px;
      height: 8px;
      flex: 0 0 auto;
      background: var(--gray-8);
    }

    .interactive-voice-wealth-progress__bar {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 24px;
      background: var(--gray-3);
    }

    .interactive-voice-wealth-distance {
      display: inline-flex;
      align-items: center;
      gap: var(--space2);
      margin-left: var(--space16);
      min-width: 0;
      color: var(--gray-6);
      font-size: var(--font-size-body);
      line-height: var(--line-height-body);
    }

    .interactive-voice-wealth-distance__value {
      color: var(--gray-3);
    }

    .interactive-voice-wealth-help {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: var(--icon-size-x6);
      height: var(--icon-size-x6);
      color: var(--gray-6);
      font-size: var(--icon-size-x6);
      line-height: var(--icon-size-x6);
    }

    .interactive-voice-wealth-title-help {
      width: var(--icon-size-x8);
      height: var(--icon-size-x8);
      flex: 0 0 var(--icon-size-x8);
      color: var(--gray-6);
      font-size: var(--icon-size-x8);
      line-height: var(--icon-size-x8);
      cursor: help;
    }

    .interactive-voice-wealth-title-help .nnicon {
      color: currentColor;
      font-size: inherit;
      line-height: inherit;
    }

    .interactive-voice-wealth-tabs.nn-tabs-primary {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      column-gap: var(--space40);
      width: 100%;
      min-width: 0;
      overflow: hidden;
    }

    .interactive-voice-wealth-tabs.nn-tabs-primary .nn-tab {
      flex: 0 0 auto;
      height: auto;
      padding: var(--space0) var(--space0) var(--space16);
    }

    .interactive-voice-wealth-tabs.nn-tabs-primary .nn-tab-indicator {
      height: 2px;
    }

    .interactive-voice-wealth-upgrade.nn-btn {
      width: 120px;
    }

    .interactive-voice-wealth-privilege {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      align-items: stretch;
      gap: var(--space40);
      max-width: 100%;
      width: 100%;
      min-width: 0;
      padding: var(--space24) var(--space28);
      border: 1px solid color-mix(in srgb, var(--wealth-card-bg-start) 18%, transparent);
      border-radius: var(--border-radius-4r);
      background: linear-gradient(90deg, rgb(from var(--wealth-card-bg-start) r g b / 0.16) 0%, rgb(from var(--wealth-card-bg-start) r g b / 0) 100%);
      box-sizing: border-box;
      overflow: hidden;
    }

    .interactive-voice-wealth-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space16);
      min-height: 270px;
      padding: var(--space0);
      border: 0;
      background: transparent;
      overflow: hidden;
    }

    .interactive-voice-wealth-card__halo {
      position: absolute;
      top: var(--space20);
      left: 50%;
      z-index: 0;
      width: 208px;
      height: 219px;
      color: var(--wealth-card-bg-start);
      transform: translateX(-50%);
      pointer-events: none;
    }

    .interactive-voice-wealth-card__icon {
      position: relative;
      z-index: 1;
      width: 180px;
      height: 180px;
      object-fit: contain;
      transform: translateY(10px);
    }

    .interactive-voice-wealth-card__text {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: var(--space12);
      width: 100%;
      text-align: center;
    }

    .interactive-voice-wealth-card__range {
      color: var(--gray-3);
      font-size: var(--font-size-subtitle);
      font-weight: var(--font-weight-medium);
      line-height: var(--line-height-subtitle);
    }

    .interactive-voice-wealth-card__name {
      color: var(--gray-3);
      font-size: var(--font-size-header-3);
      font-weight: var(--font-weight-semibold);
      line-height: var(--line-height-header-3);
    }

    .interactive-voice-wealth-benefits {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      justify-content: center;
      gap: var(--space24);
      min-width: 0;
    }

    .interactive-voice-wealth-benefit-group {
      display: flex;
      flex-direction: column;
      gap: var(--space16);
      min-width: 0;
    }

    .interactive-voice-wealth-benefit-title {
      margin: var(--space0);
      color: var(--gray-3);
      font-size: var(--font-size-subtitle);
      font-weight: var(--font-weight-medium);
      line-height: var(--line-height-subtitle);
    }

    .interactive-voice-wealth-benefit-list {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      align-items: center;
      gap: var(--space20);
      min-width: 0;
    }

    .interactive-voice-wealth-benefit {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 0;
      gap: var(--space8);
      color: var(--gray-3);
      font-size: var(--font-size-body);
      line-height: var(--line-height-subtitle);
      text-align: center;
      white-space: nowrap;
    }

    .interactive-voice-wealth-benefit__media {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 80px;
      height: 80px;
      border: 1px solid var(--gray-8);
      border-radius: var(--border-radius-4r);
      background: var(--gray-10);
      box-sizing: border-box;
      overflow: hidden;
    }

    .interactive-voice-wealth-benefit__media::before {
      display: none;
    }

    .interactive-voice-wealth-benefit__lock {
      position: absolute;
      right: var(--space4);
      bottom: var(--space4);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: var(--icon-size-x12);
      height: var(--icon-size-x12);
      border-radius: var(--border-radius-20r);
      background: var(--gray-8);
      color: var(--gray-6);
      font-size: var(--icon-size-x8);
      line-height: var(--icon-size-x8);
      pointer-events: none;
      z-index: 2;
    }

    .interactive-voice-wealth-benefit__lock .nnicon {
      font-size: inherit;
      line-height: inherit;
    }

    .interactive-voice-wealth-benefit img {
      position: relative;
      z-index: 1;
      width: var(--wealth-benefit-image-size, 66px);
      height: var(--wealth-benefit-image-size, 66px);
      object-fit: contain;
    }

    .interactive-voice-wealth-benefit > div:last-child {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .interactive-voice-wealth-benefit.is-locked .interactive-voice-wealth-benefit__media,
    .interactive-voice-wealth-benefit.is-locked > div:last-child {
      opacity: 0.6;
    }

    .interactive-voice-wealth-settings {
      display: flex;
      flex-direction: column;
      gap: var(--space16);
      width: 100%;
    }

    .interactive-voice-wealth-setting {
      display: flex;
      align-items: center;
      gap: var(--space32);
      width: 100%;
    }

    .interactive-voice-wealth-setting__copy {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      gap: var(--space8);
      min-width: 0;
    }

    .interactive-voice-wealth-setting__header {
      display: flex;
      align-items: center;

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      setActiveNav('p-nav-interactive-voice-room');

      const framework = document.getElementById('interactive-voice-framework');
      const headerSlot = document.getElementById('interactive-voice-header');
      const menuSlot = document.getElementById('interactive-voice-menu');
      const menuHoverZone = document.getElementById('interactive-voice-menu-hover-zone');
      const communitySlot = document.getElementById('interactive-voice-community');
      const voiceSlot = document.getElementById('interactive-voice-panel');
      const seatsSlot = document.getElementById('interactive-voice-seats');
      const roomButtonsSlot = document.getElementById('interactive-voice-room-buttons');
      const actionGroupSlot = document.getElementById('interactive-voice-action-group');
      const floatingAdSlot = document.getElementById('interactive-voice-floating-ad');
      const visitorAvatarsSlot = document.getElementById('interactive-voice-visitor-avatars');
      const onlineTrigger = document.querySelector('.interactive-voice-room__online');
      const onlinePopover = document.getElementById('interactive-voice-online-popover');
      const chatScroll = document.getElementById('interactive-voice-chat-scroll');
      const chatInputSlot = document.getElementById('interactive-voice-message-input');
      const tooltipLayer = document.getElementById('interactive-voice-tooltip-layer');
      const giftLayer = document.getElementById('interactive-voice-gift-layer');
      const wealthModalLayer = document.getElementById('interactive-voice-wealth-modal-layer');
      let giftActionButton = null;
      const floatingAdItems = [
        { name: '充值有礼', src: '../image/Community/interactive-voice-room/floating-ad-recharge.png' },
        { name: '礼物收藏家', src: '../image/Community/interactive-voice-room/floating-ad-gift.png' },
        { name: '秋日赛季', src: '../image/Community/interactive-voice-room/floating-ad-autumn.png' }
      ];

      function syncDarkMode(isDark) {
        localStorage.setItem('dark-mode', String(isDark));
        document.documentElement.classList.toggle('dark-mode', isDark);
        document.body.classList.toggle('dark-mode', isDark);
        notifyIframeDarkMode(isDark);
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({
            type: 'dark-mode',
            value: isDark
          }, '*');
        }
      }

      window.addEventListener('message', function(event) {
        if (!event.data || event.data.type !== 'dark-mode') return;
        const isDark = Boolean(event.data.value);
        localStorage.setItem('dark-mode', String(isDark));
        document.body.classList.toggle('dark-mode', isDark);
      });

      function toggleDarkMode() {
        syncDarkMode(!document.body.classList.contains('dark-mode'));
      }

      function toggleExpanded() {
        const isExpanded = framework.classList.toggle('is-expanded');
        document.body.classList.toggle('is-interactive-voice-expanded', isExpanded);
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({
            type: 'interactive-voice-seven-expanded',
            value: isExpanded
          }, '*');
        }
      }

      const header = createHeader({
        width: '100%',
        showBack: true,
        noticeText: ''
      });
      headerSlot.appendChild(header);

      const themeControl = header.querySelector('.nn-header__theme-toggle, [data-action="theme"]');
      if (themeControl) {
        themeControl.addEventListener('click', toggleDarkMode);
      }

      const windowIcons = header.querySelectorAll('.nn-header__window-icon');
      if (windowIcons[1]) {
        windowIcons[1].setAttribute('role', 'button');
        windowIcons[1].setAttribute('tabindex', '0');
        windowIcons[1].setAttribute('aria-label', '适配浏览器最大尺寸');
        windowIcons[1].addEventListener('click', toggleExpanded);
        windowIcons[1].addEventListener('keydown', function(event) {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            toggleExpanded();
          }
        });
      }

      menuSlot.appendChild(createInteractiveMenu());

      communitySlot.appendChild(createCommunityNavigationCombo({ communityType: 'game' }));
      const voicePanel = createVoicePanel({ launchState: 'idle' });
      voiceSlot.appendChild(voicePanel);

      const communityScroller = communitySlot.querySelector('.nn-community-combo__scroller');
      const menuList = menuSlot.querySelector('.nn-menu-list');
      const menuListWrapper = menuSlot.querySelector('.nn-menu-list-wrapper');
      let frameworkMenuScrollOffset = 0;
      let frameworkMenuMaxScroll = 0;

      function syncFrameworkMenuScroll() {
        if (!menuList || !menuListWrapper) return;
        const voiceHeight = Math.max(0, Math.ceil(voiceSlot.getBoundingClientRect().height));
        const wrapperHeight = menuListWrapper.clientHeight;
        const contentHeight = menuList.scrollHeight;
        const contentBottom = menuList.offsetTop + contentHeight;
        const visibleHeightBeforeVoice = Math.max(0, wrapperHeight - voiceHeight);
        frameworkMenuMaxScroll = Math.max(0, contentBottom - visibleHeightBeforeVoice);
        frameworkMenuScrollOffset = Math.min(frameworkMenuScrollOffset, frameworkMenuMaxScroll);
        framework.style.setProperty('--framework-menu-scroll-offset', `${frameworkMenuScrollOffset}px`);
      }

      function syncFrameworkVoiceHeight() {
        const voiceHeight = Math.max(0, Math.ceil(voiceSlot.getBoundingClientRect().height));
        framework.style.setProperty('--framework-voice-height', `${voiceHeight}px`);
        syncFrameworkMenuScroll();
      }

      function scrollFrameworkMenu(deltaY) {
        syncFrameworkMenuScroll();
        if (frameworkMenuMaxScroll <= 0) return false;
        const nextOffset = Math.max(0, Math.min(frameworkMenuMaxScroll, frameworkMenuScrollOffset + deltaY));
        if (nextOffset === frameworkMenuScrollOffset) return false;
        frameworkMenuScrollOffset = nextOffset;
        framework.style.setProperty('--framework-menu-scroll-offset', `${frameworkMenuScrollOffset}px`);
        return true;
      }

      function hideVoiceRoomInfo() {
        framework.classList.add('is-voice-room-hidden');
        requestAnimationFrame(syncFrameworkVoiceHeight);
      }

      function showVoiceRoomInfo() {
        framework.classList.remove('is-voice-room-hidden');
        requestAnimationFrame(syncFrameworkVoiceHeight);
      }

      if (window.ResizeObserver) {
        const voiceResizeObserver = new ResizeObserver(syncFrameworkVoiceHeight);
        voiceResizeObserver.observe(voiceSlot);
        voiceResizeObserver.observe(voicePanel);
        if (menuList) voiceResizeObserver.observe(menuList);
        if (menuListWrapper) voiceResizeObserver.observe(menuListWrapper);
      }

      syncFrameworkVoiceHeight();

      const leaveVoiceButton = voicePanel.querySelector('.nn-voice-panel__leave');
      if (leaveVoiceButton) {
        leaveVoiceButton.addEventListener('click', hideVoiceRoomInfo);
      }

      const firstVoiceRoom = communitySlot.querySelector('.nn-community-room');
      if (firstVoiceRoom) {
        firstVoiceRoom.addEventListener('click', showVoiceRoomInfo);
      }

      if (menuListWrapper) {
        menuListWrapper.addEventListener('wheel', function(event) {
          if (scrollFrameworkMenu(event.deltaY)) {
            event.preventDefault();
          }
        }, { passive: false });
      }

      voiceSlot.addEventListener('wheel', function(event) {
        if (event.target.closest('.nn-slider, input, textarea, select, [contenteditable="true"], .nn-voice-mode__settings-popover')) return;
        const menuRect = menuSlot.getBoundingClientRect();
        const communityRect = communitySlot.getBoundingClientRect();

        if (event.clientX >= menuRect.left && event.clientX <= menuRect.right) {
          if (scrollFrameworkMenu(event.deltaY)) {
            event.preventDefault();
          }
          return;
        }

        if (!communityScroller) return;
        if (event.clientX < communityRect.left || event.clientX > communityRect.right) return;

        const previousScrollTop = communityScroller.scrollTop;
        communityScroller.scrollTop += event.deltaY;
        if (communityScroller.scrollTop !== previousScrollTop) {
          event.preventDefault();
        }
      }, { passive: false });

      const voiceBack = voicePanel.querySelector('.nn-voice-panel__back');
      let restoreMenuTimer = null;
      let restoreEndTimer = null;
      let menuHoverTimer = null;
      let isMenuPointerInside = false;

      function clearMenuRestoreTimers() {
        if (restoreMenuTimer) {
          window.clearTimeout(restoreMenuTimer);
          restoreMenuTimer = null;
        }
        if (restoreEndTimer) {
          window.clearTimeout(restoreEndTimer);
          restoreEndTimer = null;
        }
      }

      function clearMenuHoverTimer() {
        if (menuHoverTimer) {
          window.clearTimeout(menuHoverTimer);
          menuHoverTimer = null;
        }
      }

      function showCollapsedMenuPreview() {
        if (!framework.classList.contains('is-menu-collapsed')) return;
        clearMenuHoverTimer();
        framework.classList.remove('is-menu-hovered');
        void framework.offsetWidth;
        framework.classList.add('is-menu-hovered');
      }

      function scheduleCollapsedMenuHide() {
        clearMenuHoverTimer();
        menuHoverTimer = window.setTimeout(function() {
          if (!isMenuPointerInside) {
            framework.classList.remove('is-menu-hovered');
          }
          menuHoverTimer = null;
        }, 80);
      }

      if (menuHoverZone) {
        menuHoverZone.addEventListener('mouseenter', showCollapsedMenuPreview);
        menuHoverZone.addEventListener('mouseleave', scheduleCollapsedMenuHide);
      }

      document.addEventListener('mousemove', function(event) {
        if (!framework.classList.contains('is-menu-collapsed') || !framework.classList.contains('is-menu-hovered')) return;
        const frameworkRect = framework.getBoundingClientRect();
        const isInsideVerticalRange = event.clientY >= frameworkRect.top + 50 && event.clientY <= frameworkRect.bottom;
        const isInsideLeaveZone = event.clientX >= frameworkRect.left && event.clientX <= frameworkRect.left + 70;
        if (!isInsideVerticalRange || !isInsideLeaveZone) {
          isMenuPointerInside = false;
          framework.classList.remove('is-menu-hovered');
        }
      });

      menuSlot.addEventListener('mouseenter', function() {
        isMenuPointerInside = true;
        showCollapsedMenuPreview();
      });

      menuSlot.addEventListener('mouseleave', function() {
        isMenuPointerInside = false;
        scheduleCollapsedMenuHide();
      });

      if (voiceBack) {
        voiceBack.addEventListener('click', function() {
          if (framework.classList.contains('is-menu-collapsed')) {
            clearMenuRestoreTimers();
            clearMenuHoverTimer();
            framework.classList.remove('is-menu-hovered');
            framework.classList.add('is-menu-restoring');

            restoreMenuTimer = window.setTimeout(function() {
              framework.classList.remove('is-menu-collapsed');
              restoreMenuTimer = null;
            }, 80);

            restoreEndTimer = window.setTimeout(function() {
              framework.classList.remove('is-menu-restoring');
              restoreEndTimer = null;
            }, 360);
            return;
          }

          clearMenuRestoreTimers();
          clearMenuHoverTimer();
          framework.classList.remove('is-menu-restoring');
          framework.classList.remove('is-menu-hovered');
          framework.classList.add('is-menu-collapsed');
        });
      }

      const seatData = [
        { name: 'TR.泡芙/金牌客...', avatar: '../image/Avatar/头像480.png', avatarFrame: '../image/gift/头像框-万圣节.png', index: 1, role: '主持', score: '13.3' },
        { name: 'SAMSARA', avatar: '../image/Community/interactive-voice-room/waiting-seat-sofa.png', index: 2, role: '老板', boss: true, score: '13.3', empty: true },
        { name: 'TO荼靡', avatar: '../image/Avatar/头像1095.png', avatarFrame: '../image/gift/头像框-玫瑰花窗.png', index: 3, score: '13.3' },
        { name: 'TO荼靡', avatar: '../image/Avatar/头像748.png', index: 4, score: '13.3' },
        { name: 'TO荼靡', avatar: '../image/Avatar/头像562.png', index: 5, score: '13.3' },
        { name: 'TR.泡芙/金牌客...', avatar: '../image/Avatar/头像827.png', index: 6, score: '13.3' },
        { name: 'SAMSARA', avatar: '../image/Avatar/头像629.png', index: 7 }
      ];

      function closeGiftDrawer() {
        if (!giftLayer) return;
        giftLayer.classList.remove('is-open');
        giftLayer.setAttribute('aria-hidden', 'true');
        framework.classList.remove('is-gift-open');
        if (giftActionButton) {
          giftActionButton.setAttribute('aria-pressed', 'false');
        }
      }

      function createGiftRecipients() {
        return seatData.map(function(item, index) {
          return {
            id: `interactive-voice-seat-${index + 1}`,
            seat: item.index,
            name: item.name,
            avatar: item.avatar
          };
        });
      }

      function renderGiftDrawer() {
        if (!giftLayer || typeof window.createGiftBar !== 'function') return;
        giftLayer.innerHTML = '';
        const drawer = document.createElement('div');
        drawer.className = 'interactive-voice-gift-drawer';
        drawer.addEventListener('click', function(event) {
          event.stopPropagation();
        });
        drawer.appendChild(window.createGiftBar({
          recipients: createGiftRecipients(),
          selectedRecipientIds: ['interactive-voice-seat-1'],
          onClose: closeGiftDrawer
        }));
        giftLayer.appendChild(drawer);
      }

      function openGiftDrawer() {
        if (!giftLayer || typeof window.createGiftBar !== 'function') return;
        if (!giftLayer.querySelector('.interactive-voice-gift-drawer')) {
          renderGiftDrawer();
        }
        const gift = giftLayer.querySelector('.nn-gift');
        if (gift) {
          gift.classList.remove('is-hidden');
        }
        giftLayer.classList.add('is-open');
        giftLayer.setAttribute('aria-hidden', 'false');
        framework.classList.add('is-gift-open');
        if (giftActionButton) {
          giftActionButton.setAttribute('aria-pressed', 'true');
        }
      }

      function toggleGiftDrawer() {
        if (giftLayer && giftLayer.classList.contains('is-open')) {
          closeGiftDrawer();
          return;
        }
        openGiftDrawer();
      }

      function bindGiftAction(group) {
        const giftButton = group && group.querySelector('button[aria-label="礼物"]');
        if (!giftButton) return;
        giftActionButton = giftButton;
        giftActionButton.setAttribute('aria-pressed', 'false');
        giftButton.addEventListener('click', function(event) {
          event.stopPropagation();
          toggleGiftDrawer();
        });
      }

      function renderFloatingAd() {
        if (!floatingAdSlot || !floatingAdItems.length) return;

        let activeIndex = 0;
        let autoplayTimer = null;
        let dragState = null;

        floatingAdSlot.innerHTML = '';
        floatingAdSlot.classList.remove('is-hidden', 'is-dragging');
        floatingAdSlot.style.left = '';
        floatingAdSlot.style.top = '';
        floatingAdSlot.style.right = '';
        floatingAdSlot.style.bottom = '';

        const viewport = document.createElement('div');
        viewport.className = 'interactive-voice-floating-ad__viewport';

        const slides = floatingAdItems.map(function(item, index) {
          const slide = document.createElement('div');
          slide.className = [
            'interactive-voice-floating-ad__slide',
            index === activeIndex ? 'is-active' : ''
          ].filter(Boolean).join(' ');

          const image = document.createElement('img');
          image.className = 'interactive-voice-floating-ad__image';
          image.src = item.src;
          image.alt = item.name;
          image.draggable = false;
          slide.appendChild(image);
          viewport.appendChild(slide);
          return slide;
        });

        const close = document.createElement('button');
        close.type = 'button';
        close.className = 'interactive-voice-floating-ad__close';
        close.setAttribute('aria-label', '关闭广告');
        close.innerHTML = '<i class="nnicon nicon-a-close-lineguanbi-xianxing" aria-hidden="true"></i>';

        const dotsWrap = document.createElement('div');
        dotsWrap.className = 'interactive-voice-floating-ad__dots';

        const dots = floatingAdItems.map(function(item, index) {
          const dot = document.createElement('button');
          dot.type = 'button';
          dot.className = [
            'interactive-voice-floating-ad__dot',
            index === activeIndex ? 'is-active' : ''
          ].filter(Boolean).join(' ');
          dot.setAttribute('aria-label', `切换到${item.name}`);
          dot.addEventListener('click', function(event) {
            event.stopPropagation();
            setActiveAd(index);
            restartAutoplay();
          });
          dotsWrap.appendChild(dot);
          return dot;
        });

        function setActiveAd(index) {
          activeIndex = (index + floatingAdItems.length) % floatingAdItems.length;
          slides.forEach(function(slide, slideIndex) {
            slide.classList.toggle('is-active', slideIndex === activeIndex);
          });
          dots.forEach(function(dot, dotIndex) {
            dot.classList.toggle('is-active', dotIndex === activeIndex);
          });
        }

        function startAutoplay() {
          if (floatingAdItems.length <= 1) return;
          autoplayTimer = window.setInterval(function() {
            setActiveAd(activeIndex + 1);
          }, 3600);
        }

        function restartAutoplay() {
          if (autoplayTimer) window.clearInterval(autoplayTimer);
          startAutoplay();
        }

        function clampFloatingAdPosition(left, top) {
          const parent = floatingAdSlot.offsetParent;
          if (!parent) return { left, top };
          const maxLeft = Math.max(0, parent.clientWidth - floatingAdSlot.offsetWidth);
          const maxTop = Math.max(0, parent.clientHeight - floatingAdSlot.offsetHeight);
          return {
            left: Math.max(0, Math.min(maxLeft, left)),
            top: Math.max(0, Math.min(maxTop, top))
          };
        }

        function syncFloatingAdPosition() {
          const parent = floatingAdSlot.offsetParent;
          if (!parent) return;
          const parentRect = parent.getBoundingClientRect();
          const adRect = floatingAdSlot.getBoundingClientRect();
          const next = clampFloatingAdPosition(adRect.left - parentRect.left, adRect.top - parentRect.top);
          floatingAdSlot.style.left = `${next.left}px`;
          floatingAdSlot.style.top = `${next.top}px`;
          floatingAdSlot.style.right = 'auto';
          floatingAdSlot.style.bottom = 'auto';
        }

        close.addEventListener('click', function(event) {
          event.stopPropagation();
          floatingAdSlot.classList.add('is-hidden');
          if (autoplayTimer) {
            window.clearInterval(autoplayTimer);
            autoplayTimer = null;
          }
        });

        floatingAdSlot.addEventListener('pointerdown', function(event) {
          if (event.button !== 0 && event.pointerType === 'mouse') return;
          if (event.target.closest('button')) return;
          const parent = floatingAdSlot.offsetParent;
          if (!parent) return;
          const parentRect = parent.getBoundingClientRect();
          const adRect = floatingAdSlot.getBoundingClientRect();
          dragState = {
            startX: event.clientX,
            startY: event.clientY,
            left: adRect.left - parentRect.left,
            top: adRect.top - parentRect.top
          };
          floatingAdSlot.style.left = `${dragState.left}px`;
          floatingAdSlot.style.top = `${dragState.top}px`;
          floatingAdSlot.style.right = 'auto';
          floatingAdSlot.style.bottom = 'auto';
          floatingAdSlot.classList.add('is-dragging');
          floatingAdSlot.setPointerCapture(event.pointerId);
          event.preventDefault();
        });

        floatingAdSlot.addEventListener('pointermove', function(event) {
          if (!dragState) return;
          const next = clampFloatingAdPosition(
            dragState.left + event.clientX - dragState.startX,
            dragState.top + event.clientY - dragState.startY
          );
          floatingAdSlot.style.left = `${next.left}px`;
          floatingAdSlot.style.top = `${next.top}px`;
        });

        floatingAdSlot.addEventListener('pointerup', function(event) {
          if (!dragState) return;
          dragState = null;
          floatingAdSlot.classList.remove('is-dragging');
          if (floatingAdSlot.hasPointerCapture(event.pointerId)) {
            floatingAdSlot.releasePointerCapture(event.pointerId);
          }
        });

        floatingAdSlot.addEventListener('pointercancel', function(event) {
          dragState = null;
          floatingAdSlot.classList.remove('is-dragging');
          if (floatingAdSlot.hasPointerCapture(event.pointerId)) {
            floatingAdSlot.releasePointerCapture(event.pointerId);
          }
        });

        window.addEventListener('resize', syncFloatingAdPosition);

        floatingAdSlot.appendChild(viewport);
        floatingAdSlot.appendChild(close);
        floatingAdSlot.appendChild(dotsWrap);
        startAutoplay();
      }

      function getWealthLevelMeta(level) {
        const numericLevel = Number(level);
        const safeLevel = Number.isFinite(numericLevel) ? Math.max(1, Math.min(100, Math.round(numericLevel))) : 1;
        const groupIndex = wealthLevelGroups.findIndex(function(group) {
          return safeLevel >= group.start && safeLevel <= group.end;
        });
        const group = wealthLevelGroups[groupIndex] || wealthLevelGroups[0];
        const nextLevel = safeLevel < 100 ? safeLevel + 1 : 100;
        return {
          level: safeLevel,
          nextLevel,
          name: group.name,
          iconName: group.iconName,
          bgStart: group.bgStart,
          bgEnd: group.bgEnd || group.bgStart,
          tabIndex: Math.max(groupIndex, 0),
          range: group.start === group.end ? `LV.${group.start}` : `LV. (${group.start}-${group.end})`
        };
      }

          countText: '财富榜',
          sortText: '按照财富等级排序',
          data: onlineWealthRankList
        },
        {
          name: '贡献榜',
          countText: '贡献榜',
          sortText: '按照贡献值排序',
          data: onlineContributionRankList
        }
      ];

      function createOnlineLeaderboardRows(data) {
        return data.map(function(item, index) {
          return {
            rank: index + 1,
            name: item.name,
            avatar: item.avatar,
            rankLv: item.level,
            rankText: '',
            rankSize: 'small',
            value: item.value,
            wins: item.value
          };
        });
      }

      function createRankBadge(level) {
        const badge = document.createElement('img');
        const safeLevel = Math.max(1, Math.min(100, Math.round(Number(level) || 1)));
        badge.className = 'interactive-voice-online-popover__wealth';
        badge.src = `../image/wealth-level/wealth-level-${safeLevel}.png`;
        badge.alt = `财富等级${safeLevel}`;
        return badge;
      }

      function syncLeaderboardWealthBadges(leaderboard, data) {
        if (!leaderboard) return;
        leaderboard.querySelectorAll('.nn-leaderboard__row').forEach(function(row) {
          const rank = Number(row.dataset.rank || 0);
          const item = data[rank - 1];
          if (!item) return;
          const identity = row.querySelector('.nn-leaderboard__identity');
          if (!identity) return;
          identity.querySelectorAll('.nn-equity-rank').forEach(function(node) {
            node.remove();
          });
          identity.appendChild(createRankBadge(item.level));
        });
        leaderboard.querySelectorAll('.nn-leaderboard__self-title .nn-equity-rank').forEach(function(node) {
          node.remove();
        });
      }

      function createPodiumCrown() {
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('class', 'interactive-voice-online-popover__podium-crown');
        svg.setAttribute('viewBox', '0 0 32 32');
        svg.setAttribute('aria-hidden', 'true');
        svg.innerHTML = '<path fill="currentColor" d="M6.4 24.7h19.2l1.7-12.1-6.3 4.1-5-9.2-5 9.2-6.3-4.1 1.7 12.1ZM5 11.1a2.4 2.4 0 1 1 0-4.8 2.4 2.4 0 0 1 0 4.8Zm11-3.8a2.4 2.4 0 1 1 0-4.8 2.4 2.4 0 0 1 0 4.8Zm11 3.8a2.4 2.4 0 1 1 0-4.8 2.4 2.4 0 0 1 0 4.8Z"/>';
        return svg;
      }

      function createLeaderboardPodium(data) {
        const podium = document.createElement('div');
        podium.className = 'interactive-voice-online-popover__podium';
        const podiumOrder = [1, 0, 2];
        const podiumStyles = [
          { color: '#F6C66B', bg: '#B08A44', border: '#F6C66B', avatar: '#FFAE57', crown: '#FFD66F' },
          { color: '#8EB6D8', bg: '#6D93B1', border: '#8EB6D8', avatar: '#C7E6F8', crown: '#D9F2FF' },
          { color: '#B87852', bg: '#8A604A', border: '#B87852', avatar: '#E59B5E', crown: '#E7A676' }
        ];
        podiumOrder.forEach(function(dataIndex, orderIndex) {
          const item = data[dataIndex];
          if (!item) return;
          const rank = dataIndex + 1;
          const style = podiumStyles[dataIndex] || podiumStyles[0];
          const card = document.createElement('div');
          card.className = `interactive-voice-online-popover__podium-card is-rank-${rank}`;
          card.style.setProperty('--podium-color', style.color);
          card.style.setProperty('--podium-bg-color', style.bg);
          card.style.setProperty('--podium-border-color', style.border);
          card.style.setProperty('--podium-avatar-color', style.avatar);
          card.style.setProperty('--podium-crown-color', style.crown);

          const avatarWrap = document.createElement('div');
          avatarWrap.className = 'interactive-voice-online-popover__podium-avatar';
          avatarWrap.appendChild(window.createAvatar({
            src: item.avatar,
            text: item.name,
            size: rank === 1 ? 60 : 48
          }));
          avatarWrap.appendChild(createPodiumCrown());
          card.appendChild(avatarWrap);

          card.appendChild(createTextElement('interactive-voice-online-popover__podium-name', item.name));
          const rankWrap = document.createElement('div');
          rankWrap.className = 'interactive-voice-online-popover__podium-rank';
          rankWrap.appendChild(createRankBadge(item.level));
          card.appendChild(rankWrap);
          card.appendChild(createTextElement('interactive-voice-online-popover__podium-value', item.value));
          podium.appendChild(card);
        });
        return podium;
      }

      function createOnlinePopoverRow(item) {
        const row = document.createElement('div');
        row.className = 'interactive-voice-online-popover__row';
        if (typeof window.createAvatar === 'function') {
          row.appendChild(window.createAvatar({
            src: item.avatar,
            text: item.name,
            size: 36
          }));
        }

        const copy = document.createElement('div');
        copy.className = 'interactive-voice-online-popover__copy';
        const wealth = document.createElement('img');
        wealth.className = 'interactive-voice-online-popover__wealth';
        wealth.src = `../image/wealth-level/wealth-level-${item.level}.png`;
        wealth.alt = `财富等级${item.level}`;
        copy.appendChild(createTextElement('interactive-voice-online-popover__name', item.name));
        copy.appendChild(wealth);
        row.appendChild(copy);

        row.appendChild(createTextElement('interactive-voice-online-popover__value', item.value));
        return row;
      }

      function syncAudienceHoverWidth() {
        if (!onlinePopover) return;
        const searchInput = onlinePopover.querySelector('.interactive-voice-online-popover__search-input');
        if (!searchInput) return;
        onlinePopover.style.setProperty('--interactive-voice-audience-hover-width', `${searchInput.getBoundingClientRect().width}px`);
      }

      function renderOnlinePopoverPanel(index) {
        if (!onlinePopover) return;
        const body = onlinePopover.querySelector('.interactive-voice-online-popover__body');
        if (!body) return;
        body.innerHTML = '';

        const panel = onlinePopoverPanels[index] || onlinePopoverPanels[0];

        if (index > 0 && typeof window.createLeaderboard === 'function') {
          const leaderboardSlot = document.createElement('div');
          leaderboardSlot.className = 'interactive-voice-online-popover__leaderboard-slot';
          function renderLeaderboard(periodIndex) {
            leaderboardSlot.innerHTML = '';
            const periodData = panel.data.map(function(item, itemIndex) {
              return Object.assign({}, item, {
                value: periodIndex === 0 ? item.value : item.value,
                level: item.level + periodIndex + itemIndex
              });
            });
            leaderboardSlot.appendChild(createLeaderboardPodium(periodData));
            const leaderboard = window.createLeaderboard({
              primaryTabs: [panel.name],
              primaryActive: 0,
              showMore: false,
              mode: 'wins',
              rows: createOnlineLeaderboardRows(periodData),
              maxRows: 12,
              showSelf: true,
              avatarSize: 36,
              self: {
                rank: ' ',
                name: 'candice',
                avatar: '../image/Avatar/头像496.png',
                desc: panel.name === '魅力榜' ? '0 魅力值' : panel.name === '财富榜' ? '0 财富值' : '0 贡献值',
                value: '暂未上榜'
              },
              height: 520,
              className: 'interactive-voice-online-popover__leaderboard'
            });
            leaderboardSlot.appendChild(leaderboard);
            syncLeaderboardWealthBadges(leaderboard, periodData);
            requestAnimationFrame(function() {
              const bodyRect = body.getBoundingClientRect();
              const leaderboardRect = leaderboard.getBoundingClientRect();
              const nextHeight = Math.max(0, bodyRect.bottom - leaderboardRect.top);
              leaderboard.style.setProperty('--nn-leaderboard-height', `${nextHeight}px`);
            });
          }
          if (typeof window.createTabs === 'function') {
            const rankTabsWrap = document.createElement('div');
            rankTabsWrap.className = 'interactive-voice-online-popover__rank-tabs';
            rankTabsWrap.appendChild(window.createTabs({
              type: 'tertiary-box',
              defaultActive: 0,
              tabs: [
                { name: '日榜' },
                { name: '周榜' },
                { name: '月榜' }
              ],
              onChange: function(event) {
                renderLeaderboard(event.index);
              }
            }));
            body.appendChild(rankTabsWrap);
          }
          body.appendChild(leaderboardSlot);
          renderLeaderboard(0);
          return;
        }

        const summary = document.createElement('div');
        summary.className = 'interactive-voice-online-popover__summary';
        summary.appendChild(createTextElement('', panel.countText));
        summary.appendChild(createTextElement('', panel.sortText));
        body.appendChild(summary);

        const list = document.createElement('div');
        list.className = 'interactive-voice-online-popover__list';
        function renderAudienceList(keyword) {
          const normalizedKeyword = String(keyword || '').trim().toLowerCase();
          const filteredData = normalizedKeyword
            ? panel.data.filter(function(item) {
              return [
                item.name,
                item.role,
                item.level,
                item.value
              ].some(function(value) {
                return String(value || '').toLowerCase().includes(normalizedKeyword);
              });
            })
            : panel.data;
          summary.firstChild.textContent = normalizedKeyword ? `${filteredData.length} 位观众` : panel.countText;
          list.innerHTML = '';
          if (!filteredData.length) {
            list.appendChild(createTextElement('interactive-voice-online-popover__empty', '暂无匹配观众'));
            return;
          }
          filteredData.forEach(function(item) {
            list.appendChild(createOnlinePopoverRow(item));
          });
        }
        if (typeof window.createInput === 'function') {
          const searchWrap = document.createElement('div');
          searchWrap.className = 'interactive-voice-online-popover__search';
          const searchInput = window.createInput({
            placeholder: '搜索用户昵称/ID',
            size: 'default',
            showSearch: true,
            onInput: function(event) {
              renderAudienceList(event.value);
            },
            onClear: function() {
              renderAudienceList('');
            }
          });
          searchInput.classList.add('interactive-voice-online-popover__search-input');
          searchWrap.appendChild(searchInput);
          body.appendChild(searchWrap);
        }
        body.appendChild(list);
        renderAudienceList('');
        requestAnimationFrame(syncAudienceHoverWidth);
      }

      function renderOnlinePopover() {
        if (!onlinePopover) return;
        onlinePopover.innerHTML = '';
        onlinePopover.setAttribute('role', 'dialog');
        onlinePopover.setAttribute('aria-label', '在线人数和排行榜');
        const close = document.createElement('button');
        close.type = 'button';
        close.className = 'interactive-voice-online-popover__close';
        close.setAttribute('aria-label', '关闭弹层');
        close.innerHTML = '<svg class="svgfont interactive-voice-online-popover__close-icon" aria-hidden="true"><use xlink:href="#nicon-a-CollapseTotheright-linexiangyoushouqi-xianxing"></use></svg>';
        close.addEventListener('click', function(event) {
          event.stopPropagation();
          closeOnlinePopover();
        });

        const tabsWrap = document.createElement('div');
        tabsWrap.className = 'interactive-voice-online-popover__tabs';
        tabsWrap.appendChild(close);
        if (typeof window.createTabs === 'function') {
          tabsWrap.appendChild(window.createTabs({
            type: 'primary',
            defaultActive: 0,
            tabs: onlinePopoverPanels.map(function(panel) {
              return { name: panel.name };
            }),
            onChange: function(event) {
              renderOnlinePopoverPanel(event.index);
              requestAnimationFrame(syncAudienceHoverWidth);
            }
          }));
        }
        onlinePopover.appendChild(tabsWrap);

        const body = document.createElement('div');
        body.className = 'interactive-voice-online-popover__body';
        onlinePopover.appendChild(body);
        renderOnlinePopoverPanel(0);
        requestAnimationFrame(syncAudienceHoverWidth);
      }

      function closeOnlinePopover() {
        if (!onlinePopover || !onlineTrigger) return;
        onlinePopover.classList.remove('is-open');
        onlinePopover.setAttribute('aria-hidden', 'true');
        onlineTrigger.classList.remove('is-open');
        onlineTrigger.setAttribute('aria-expanded', 'false');
      }

      function openOnlinePopover() {
        if (!onlinePopover || !onlineTrigger) return;
        if (!onlinePopover.children.length) {
          renderOnlinePopover();
        }
        onlinePopover.classList.add('is-open');
        onlinePopover.setAttribute('aria-hidden', 'false');
        onlineTrigger.classList.add('is-open');
        onlineTrigger.setAttribute('aria-expanded', 'true');
        requestAnimationFrame(syncAudienceHoverWidth);
      }

      function toggleOnlinePopover() {
        if (onlinePopover && onlinePopover.classList.contains('is-open')) {
          closeOnlinePopover();
          return;
        }
        openOnlinePopover();
      }

      if (onlineTrigger) {
        onlineTrigger.setAttribute('role', 'button');
        onlineTrigger.setAttribute('tabindex', '0');
        onlineTrigger.setAttribute('aria-haspopup', 'dialog');
        onlineTrigger.setAttribute('aria-expanded', 'false');
        onlineTrigger.addEventListener('click', function(event) {
          event.stopPropagation();
          toggleOnlinePopover();
        });
        onlineTrigger.addEventListener('keydown', function(event) {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            toggleOnlinePopover();
          }
        });
      }

      document.addEventListener('click', function(event) {
        if (!onlinePopover || !onlinePopover.classList.contains('is-open')) return;
        if (onlinePopover.contains(event.target)) return;
        if (onlineTrigger && onlineTrigger.contains(event.target)) return;
        closeOnlinePopover();
      });
      window.addEventListener('resize', syncAudienceHoverWidth);

      appendChatMessage({
        type: 'other',
        name: '和你隔了几片海',
        time: '8分钟前',
        text: '万圣节活动开始',
        avatarSrc: '../image/Avatar/头像824.png'
      });

      appendChatMessage({
        type: 'other',
        name: '和你隔了几片海',
        time: '8分钟前',
        text: '回复：冯宝宝  😊影流有人吗，不想被演了还有为什么我游戏内打字一直说频道内就我一个人，开关屏蔽也没用，有没有大神带菜鸟起飞了',
        showReply: true,
        avatarSrc: '../image/Avatar/头像748.png',
        className: 'interactive-voice-chat__message--wide'
      });

      appendChatMessage({
        type: 'other',
        name: '苦艾1234',
        time: '8分钟前',
        text: '来一个会沟通的队友，先开麦确认位置。',
        avatarSrc: '../image/Avatar/头像629.png'
      });

      const sticker = document.createElement('div');
      sticker.className = 'interactive-voice-chat__sticker';
      sticker.appendChild(window.createAvatar({ src: '../image/Avatar/头像629.png', text: '苦艾1234', size: 36 }));
      const stickerImage = document.createElement('img');
      stickerImage.className = 'interactive-voice-chat__sticker-image';
      stickerImage.src = '../image/gift/1.png';
      stickerImage.alt = '表情';
      sticker.appendChild(stickerImage);
      chatScroll.appendChild(sticker);

      chatInputSlot.appendChild(window.createChatMessageInput({
        size: 'default',
        state: 'empty',
        placeholder: '按Enter回车键发送消息',
        showGift: false,
        showUpload: true,
        showSendButton: false,
        interactive: true,
        onSend: function(payload) {
          const text = payload && payload.text ? payload.text.trim() : '';
          if (!text) return;
          appendChatMessage({
            type: 'mine',
            name: 'candice',
            time: '刚刚',
            text,
            avatarSrc: '../image/Avatar/头像496.png'
          });
          requestAnimationFrame(function() {
            chatScroll.scrollTop = chatScroll.scrollHeight;
          });
        }
      }));

      if (typeof window.createScrollbar === 'function') {
        const contentShell = document.querySelector('.interactive-voice-content');
        const chatLog = chatScroll.parentElement;
        window.createScrollbar({
          target: chatScroll,
          container: contentShell,
          hoverTarget: contentShell,
          variant: 'page',
          right: 0,
          top: function() {
            return chatLog.getBoundingClientRect().top - contentShell.getBoundingClientRect().top;
          },
          bottom: function() {
            return contentShell.getBoundingClientRect().bottom - chatLog.getBoundingClientRect().bottom;
          },
          minThumbSize: 60
        });
      }
    });
  </script>
</body>
</html>
