<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NN 页面展示 - Personal Center 我的</title>
  <script src="../preview-mode-bootstrap.js?v=20261030-preview-persist"></script>
  <link rel="stylesheet" href="../styles.css?v=20261119-din-unit-shift">
  <link rel="stylesheet" href="../iconfont/iconfont.css?v=20261111-launch-update-icons">
  <script src="../iconfont/iconfont.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-width: 100%;
      min-height: 100vh;
      margin: var(--space0);
      overflow: auto;
      background: var(--gray-1);
      color: var(--gray-3);
      font-family: var(--font-family-main);
    }

    body.is-personal-center-expanded #nav-iframe {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .personal-center-shell {
      min-width: 1280px;
      min-height: calc(100vh - 60px);
      margin: var(--space60) var(--space0) var(--space0) 260px;
      padding: var(--space40) var(--space60);
    }

    .personal-center-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-width: 1280px;
      min-height: 900px;
    }

    .personal-center-framework {
      --personal-center-header-height: 50px;
      --personal-center-menu-width: 70px;
      position: relative;
      width: 1280px;
      height: 900px;
      min-width: 1280px;
      min-height: 900px;
      overflow: hidden;
      background: var(--gray-1);
      color: var(--gray-3);
    }

    .personal-center-framework::after {
      position: absolute;
      inset: var(--space0);
      z-index: 120;
      box-shadow: inset 0 0 0 1px var(--gray-8);
      content: '';
      pointer-events: none;
    }

    .personal-center-framework.is-expanded {
      position: fixed;
      inset: var(--space0);
      z-index: 2000;
      width: 100vw;
      height: 100vh;
      min-width: 0;
      min-height: 0;
    }

    .personal-center-framework__header {
      position: absolute;
      top: var(--space0);
      left: var(--space0);
      z-index: 30;
      width: 100%;
      height: var(--personal-center-header-height);
    }

    .personal-center-framework__header .nn-header {
      width: 100% !important;
      padding-right: var(--space0);
      border-bottom-color: var(--gray-10);
    }

    .personal-center-framework__header .nn-header--default {
      padding-left: calc(var(--personal-center-menu-width) + var(--space24));
    }

    .personal-center-framework__menu {
      position: absolute;
      top: var(--personal-center-header-height);
      bottom: var(--space0);
      left: var(--space0);
      z-index: 20;
      width: var(--personal-center-menu-width);
      overflow: visible;
      background: var(--gray-1);
    }

    .personal-center-framework__menu .nn-menu {
      width: var(--personal-center-menu-width);
      height: 100%;
      min-height: 0;
    }

    .personal-center-framework__content {
      position: absolute;
      top: var(--personal-center-header-height);
      right: var(--space0);
      bottom: var(--space0);
      left: var(--personal-center-menu-width);
      overflow: hidden;
      background: var(--gray-1);
    }

    .personal-center-content {
      height: 100%;
      padding: var(--space24) var(--space24) var(--space40);
      overflow-y: auto;
      scrollbar-width: none;
    }

    .personal-center-content::-webkit-scrollbar {
      display: none;
    }

    .personal-center-content.is-steam-dashboard {
      overflow: hidden;
    }

    .personal-center-content.is-steam-dashboard .personal-center-content__inner {
      height: 100%;
    }

    .personal-center-content__inner {
      width: 100%;
      max-width: 1600px;
      margin: var(--space0) auto;
    }

    .personal-center-account-management {
      width: 100%;
      max-width: 1130px;
      min-height: 100%;
      margin: var(--space0) auto;
    }

    .personal-center-account-management[hidden] {
      display: none;
    }

    .personal-center-steam-dashboard {
      display: flex;
      width: 100%;
      height: 100%;
      max-width: 1600px;
      min-height: 0;
      flex-direction: column;
      margin: var(--space0) auto;
    }

    .personal-center-steam-dashboard[hidden] {
      display: none;
    }

    .personal-center-steam-dashboard__sticky-header {
      flex: 0 0 auto;
      padding: var(--space0) var(--space0) var(--space16);
      background: var(--gray-1);
    }

    .personal-center-steam-dashboard__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space16);
      margin-bottom: var(--space24);
    }

    .personal-center-steam-dashboard__column-headings {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(480px, 0.9fr);
      gap: var(--space24);
    }

    .personal-center-steam-dashboard__title,
    .personal-center-steam-dashboard__section-title {
      margin: var(--space0);
    }

    .personal-center-steam-dashboard__title {
      color: var(--gray-3);
      font-size: var(--font-size-header-2);
      font-weight: var(--font-weight-semibold);
      line-height: var(--line-height-header-2);
    }

    .personal-center-steam-dashboard__layout {
      display: grid;
      min-height: 0;
      flex: 1 1 auto;
      grid-template-columns: minmax(0, 1fr) minmax(480px, 0.9fr);
      align-items: stretch;
      gap: var(--space24);
      overflow: visible;
    }

    .personal-center-steam-dashboard__column {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: visible;
    }

    .personal-center-steam-dashboard__column--ranking {
      display: flex;
      flex-direction: column;
      gap: var(--space12);
    }

    .personal-center-steam-dashboard__column-scroller {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
    }

    .personal-center-steam-dashboard__column--ranking .personal-center-steam-dashboard__column-scroller {
      height: auto;
      min-height: 0;
      flex: 1 1 auto;
    }

    .personal-center-steam-dashboard__ranking-toolbar {
      display: flex;
      min-width: 0;
      min-height: 38px;
      flex: 0 0 auto;
      align-items: center;
      justify-content: space-between;
      gap: var(--space16);
    }

    .personal-center-steam-dashboard__ranking-tabs {
      min-width: 0;
    }

    .personal-center-steam-dashboard__ranking-region {
      width: 184px;
      flex: 0 0 auto;
    }

    .personal-center-steam-dashboard__ranking-region:empty {
      display: none;
    }

    .personal-center-steam-dashboard__ranking-region .nn-dropdown {
      width: 100%;
    }

    .personal-center-steam-dashboard__section-title {
      color: var(--gray-5);
      font-size: var(--font-size-title);
      font-weight: var(--font-weight-medium);
      line-height: var(--line-height-title);
    }

    .personal-center-steam-dashboard__game-list {
      display: flex;
      flex-direction: column;
      gap: var(--space12);
    }

    .personal-center-steam-dashboard__game-list .nn-wishlist-card {
      width: 100%;
      min-width: 0;
    }

    .personal-center-steam-dashboard__table {
      min-width: 0;
    }

    .personal-center-steam-dashboard__table .personal-center-steam-dashboard__ranking-table-wrap,
    .personal-center-steam-dashboard__table .personal-center-steam-dashboard__ranking-table {
      overflow: visible;
    }

    .personal-center-steam-dashboard__table .personal-center-steam-dashboard__ranking-table.nn-table--sticky-header .nn-table__head-cell {
      top: var(--space0);
      z-index: 11;
    }

    .personal-center-steam-dashboard__table .personal-center-steam-dashboard__ranking-table.nn-table--sticky-footer .nn-table__foot-cell {
      height: 64px;
      bottom: var(--space0);
      z-index: 11;
    }

    .personal-center-user-profile {
      display: flex;
      align-items: center;
      gap: var(--space48);
      margin-bottom: var(--space40);
    }

    .personal-center-user-profile__main {
      display: flex;
      align-items: center;
      width: 100%;
      flex: 1 1 auto;
      gap: var(--space16);
    }

    .personal-center-user-profile__avatar {
      flex: 0 0 auto;
    }

    .personal-center-user-profile__content {
      display: flex;
      min-width: 0;
      flex: 1 1 auto;
      flex-direction: column;
      gap: var(--space4);
    }

    .personal-center-user-profile__identity,
    .personal-center-user-profile__meta,
    .personal-center-user-profile__stats {
      display: flex;
      align-items: center;
    }

    .personal-center-user-profile__identity {
      gap: var(--space6);
    }

    .personal-center-user-profile__edit-action {
      display: inline-flex;
      margin-left: var(--space10);
    }

    .personal-center-user-profile__name {
      overflow: hidden;
      color: var(--gray-3);
      font-size: var(--font-size-header-2);
      font-weight: var(--font-weight-semibold);
      line-height: var(--line-height-header-2);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .personal-center-user-profile__gender {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: var(--icon-size-x10);
      height: var(--icon-size-x10);
      flex: 0 0 var(--icon-size-x10);
      color: var(--Esports-Blue-LD);
      font-size: var(--icon-size-x10);
      line-height: var(--icon-size-x10);
    }

    .personal-center-user-profile__meta {
      gap: var(--space10);
      color: var(--gray-6);
      font-size: var(--font-size-body);
      line-height: var(--line-height-body);
    }

    .personal-center-user-profile__meta-item + .personal-center-user-profile__meta-item {
      padding-left: var(--space10);
      border-left: 1px solid var(--gray-8);
    }

    .personal-center-user-profile__signature {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .personal-center-user-profile__stats {
      flex: 0 0 auto;
      gap: var(--space40);
      margin-left: var(--space80);
    }

    .personal-center-user-profile__stat {
      display: flex;
      align-items: center;
      flex-direction: column;
      gap: var(--space0);
    }

    .personal-center-user-profile__stat-value {
      color: var(--gray-3);
      font-family: var(--font-family-din);
      font-size: var(--font-size-data-number);
      font-weight: var(--font-weight-semibold);
      line-height: var(--line-height-header-1);
    }

    .personal-center-user-profile__stat-label {
      color: var(--gray-6);
      font-size: var(--font-size-body);
      line-height: var(--line-height-body);
    }

    .personal-center-game-data {
      margin-bottom: var(--space40);
    }

    .personal-center-game-overview {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space16);
      margin-bottom: var(--space16);
    }

    .personal-center-game-overview__stat {
      display: grid;
      width: 100%;
      min-width: 0;
      max-width: 100%;
      border: 1px solid var(--gray-9);
      border-radius: var(--border-radius-4r);
      background: var(--gray-10);
      box-sizing: border-box;
    }

    .personal-center-game-overview__stat--summary {
      --personal-center-summary-number-size: 60px;
      min-height: 180px;
      grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
      align-items: center;
      gap: var(--space24);
      padding: var(--space24);
    }

    .personal-center-game-overview__stat--interactive {
      cursor: pointer;
      transition: border-color 160ms ease, background-color 160ms ease;
    }

    .personal-center-game-overview__stat--interactive:hover {
      border-color: var(--gray-8);
      background: var(--gray-9);
    }

    .personal-center-game-overview__stat--interactive:focus-visible {
      outline: 1px solid var(--Esports-Blue);
      outline-offset: var(--space2);
    }

    .personal-center-game-overview__primary {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      width: 100%;
    }

    .personal-center-game-overview__stat--summary .personal-center-game-overview__primary {
      align-self: center;
      gap: var(--space16);
    }

    .personal-center-game-overview__stat--summary .personal-center-game-overview__primary .accelerator-asset-detail-stat__value {
      order: 2;
      flex: 0 0 auto;
      align-self: flex-start;
    }

    .personal-center-game-overview__stat--summary .personal-center-duration-segment {
      display: inline-flex;
      align-items: baseline;
      gap: var(--space2);
      white-space: nowrap;
    }

    .personal-center-metric-unit-text {
      display: block;
      transform: translateY(calc(var(--space2) * -1));
      line-height: normal;
      white-space: nowrap;
    }

    .personal-center-game-overview__stat--summary .personal-center-summary-number {
      display: block;
      flex: 0 0 auto;
      color: var(--gray-3);
      font-family: var(--font-family-din);
      font-size: var(--personal-center-summary-number-size);
      font-weight: var(--font-weight-bold);
      line-height: 1;
    }

    .personal-center-game-overview__stat--summary .personal-center-metric-unit-text {
      font-size: var(--font-size-header-3);
      font-style: normal;
      font-weight: var(--font-weight-medium);
      line-height: var(--line-height-header-3);
    }

    .personal-center-game-overview__label {
      display: inline-flex;
      align-items: center;
      gap: var(--space0);
      order: 1;
      color: var(--gray-4);
      font-size: var(--font-size-title);
      font-weight: var(--font-weight-semibold);
      line-height: var(--line-height-title);
      white-space: nowrap;
    }

    .personal-center-game-overview__label .nn-user-data-card__title-icon {
      font-weight: var(--font-weight-normal);
    }

    .personal-center-game-overview__meta-value {
      display: grid;
      width: 100%;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space20) var(--space24);
      box-sizing: border-box;
    }

    .personal-center-game-overview__stat--summary .personal-center-game-overview__meta-value {
      align-self: center;
      align-content: center;
    }

    .personal-center-game-overview__rank-item {
      display: flex;
      min-width: 0;
      flex-direction: column;
      align-items: flex-start;
      gap: var(--space4);
      white-space: nowrap;
    }

    .personal-center-game-overview__rank-scope {
      overflow: hidden;
      max-width: 100%;
      color: var(--gray-6);
      font-size: var(--font-size-caption);
      line-height: var(--line-height-caption);
      text-overflow: ellipsis;
    }

    .personal-center-game-overview__rank-value {
      display: inline-flex;
      align-items: center;
      color: var(--gray-3);
      font-size: var(--font-size-header-3);
      font-variant-numeric: tabular-nums;
      font-weight: var(--font-weight-semibold);
      line-height: var(--line-height-header-3);
    }

    .personal-center-rank-current,
    .personal-center-rank-all {
      display: inline-flex;
      align-items: center;
    }

    .personal-center-rank-current {
      font-size: var(--font-size-subtitle);
      line-height: var(--line-height-subtitle);
    }

    .personal-center-rank-label {
      color: var(--gray-6);
      font-weight: var(--font-weight-normal);
    }

    .personal-center-rank-number {
      color: var(--gray-5);
      font-weight: var(--font-weight-medium);
    }

    .personal-center-rank-trend {
      display: inline-flex;
      align-items: center;
      gap: var(--space0);
      margin-left: var(--space4);
      font-family: var(--font-family-main);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-medium);
      line-height: var(--line-height-caption);
      white-space: nowrap;
    }

    .personal-center-rank-trend > span:last-child {
      margin-left: -1px;
    }

    .personal-center-rank-trend .nnicon {
      display: inline-flex;
      width: var(--icon-size-x6);
      height: var(--icon-size-x6);
      flex: 0 0 var(--icon-size-x6);
      align-items: center;
      justify-content: center;
      font-size: var(--icon-size-x6);
      line-height: var(--icon-size-x6);
    }

    .personal-center-rank-trend--up {
      color: var(--Green);
    }

    .personal-center-rank-trend--down {
      color: var(--Red);
    }

    .personal-center-recommendations .nn-wishlist-card__data-rank-value {
      display: inline-flex;
      align-items: baseline;
    }

    .personal-center-rank-all {
      color: var(--gray-6);
      font-size: var(--font-size-body);
      font-weight: var(--font-weight-normal);
      line-height: var(--line-height-body);
    }

    .personal-center-game-overview__rank-arrow {
      position: static;
      width: var(--icon-size-x8);
      height: var(--icon-size-x8);
      margin-left: var(--space0);
      font-size: var(--icon-size-x8);
      line-height: var(--icon-size-x8);
      transform: none;
      transition: transform 0.16s ease;
    }

    .personal-center-game-overview__stat:hover .personal-center-game-overview__rank-arrow {
      transform: translateX(var(--space2));
    }

    .personal-center-accelerator-overview {
      margin-top: var(--space16);
    }

    .personal-center-game-overview__stat--accelerator {
      --personal-center-accelerator-value-size: 52px;
      min-height: 160px;
      grid-template-columns: minmax(240px, 0.75fr) minmax(0, 1.25fr) minmax(180px, 224px);
      align-content: center;
      align-items: end;
      gap: var(--space24);
      padding: var(--space24) var(--space32);
    }

    .personal-center-game-overview__stat--accelerator .personal-center-game-overview__primary {
      justify-content: flex-start;
      gap: var(--space16);
    }

    .personal-center-game-overview__stat--accelerator .personal-center-game-overview__meta-value {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      align-content: normal;
      gap: var(--space24);
    }

    .personal-center-game-overview__stat--accelerator .nn-game-accelerator-popover__duration-value {
      display: inline-flex;
      align-items: baseline;
      gap: var(--space4);
      order: 2;
      align-self: flex-start;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
    }

    .personal-center-game-overview__stat--accelerator .nn-game-accelerator-popover__duration-segment {
      display: inline-flex;
      align-items: baseline;
      gap: var(--space2);
    }

    .personal-center-game-overview__stat--accelerator .nn-game-accelerator-popover__duration-number {
      display: block;
      flex: 0 0 auto;
      color: var(--gray-3);
      font-family: var(--font-family-din);
      font-size: var(--personal-center-accelerator-value-size);
      font-weight: var(--font-weight-bold);
      line-height: 1;
    }

    .personal-center-game-overview__stat--accelerator .nn-game-accelerator-popover__duration-unit {
      display: block;
      transform: translateY(calc(var(--space2) * -1));
      color: var(--gray-5);
      font-family: var(--font-family-main);
      font-size: var(--font-size-body);
      font-weight: var(--font-weight-medium);
      line-height: normal;
    }

    .personal-center-game-overview__stat--accelerator .personal-center-game-overview__rank-scope {
      font-size: var(--font-size-body);
      line-height: var(--line-height-body);
    }

    .personal-center-game-overview__stat--accelerator .personal-center-game-overview__rank-value {
      font-size: var(--font-size-header-2);
      line-height: var(--line-height-header-2);
    }

    .personal-center-accelerator-actions {
      display: flex;
      min-width: 0;
      flex-direction: column;
      align-items: stretch;
      align-self: center;
      justify-content: center;
      gap: var(--space12);
    }

    .personal-center-accelerator-actions .nn-btn {
      width: 100%;
    }

    .personal-center-auto-pause-modal {
      position: absolute;
      inset: var(--space0);
      z-index: 160;
      display: grid;
      place-items: center;
      padding: var(--space24);
      background: var(--mask);
      font-family: var(--font-family-main);
    }

    .personal-center-auto-pause-dialog.nn-toast {
      width: 560px;
      max-width: 100%;
    }

    .personal-center-auto-pause-content {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: var(--space16);
    }

    .personal-center-auto-pause-intro {
      display: flex;
      flex-direction: column;
      gap: var(--space6);
      padding: var(--space16);
      border-radius: var(--border-radius-4r);
      background: var(--gray-10);
    }

    .personal-center-auto-pause-intro__title {
      color: var(--gray-3);
      font-size: var(--font-size-subtitle);
      font-weight: var(--font-weight-semibold);
      line-height: var(--line-height-subtitle);
    }

    .personal-center-auto-pause-intro__description,
    .personal-center-auto-pause-intro__notice,
    .personal-center-auto-pause-requirement__description {
      margin: var(--space0);
      color: var(--gray-6);
      font-size: var(--font-size-body);
      line-height: var(--line-height-body);
    }

    .personal-center-auto-pause-intro__notice {
      color: var(--gray-5);
    }

    .personal-center-auto-pause-requirements {
      display: flex;
      flex-direction: column;
      gap: var(--space8);
    }

    .personal-center-auto-pause-requirement {
      display: grid;
      min-width: 0;
      grid-template-columns: var(--icon-size-x12) minmax(0, 1fr) auto;
      align-items: center;
      gap: var(--space12);
      padding: var(--space12) var(--space16);
      border: 1px solid var(--gray-8);
      border-radius: var(--border-radius-4r);
      background: var(--gray-2);
    }

    .personal-center-auto-pause-requirement__icon {
      display: inline-flex;
      width: var(--icon-size-x12);
      height: var(--icon-size-x12);
      align-items: center;
      justify-content: center;
      color: var(--gray-6);
      font-size: var(--icon-size-x9);
      line-height: var(--icon-size-x12);
    }

    document.addEventListener('DOMContentLoaded', function() {

      function acceleratorDurationParts() {
        const totalSeconds = Math.max(0, Math.floor(acceleratorRemainingSeconds));
        return [
          String(Math.floor(totalSeconds / 3600)),
          String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0'),
          String(totalSeconds % 60).padStart(2, '0')
        ];
      }

      function syncAcceleratorDuration() {
        const values = acceleratorDurationParts();
        const card = acceleratorOverviewCards[0];
        card.segments.forEach(function(segment, index) {
          segment.value = values[index];
        });
        acceleratorDurationNumberNodes.forEach(function(number, index) {
          number.textContent = values[index];
        });
        if (acceleratorDurationStat) {
          const valueDescription = card.segments.map(function(segment) {
            return segment.value + segment.unit;
          }).join('');
          const rankDescription = card.ranks.map(function(rank) {
            return rank.scope + rank.value + rankTrendDescription(rank.delta);
          }).join('，');
          acceleratorDurationStat.setAttribute('aria-label', card.text + '，' + valueDescription + '，' + rankDescription);
        }
      }

      function stopAcceleratorCountdown() {
        if (acceleratorCountdownTimer) window.clearInterval(acceleratorCountdownTimer);
        acceleratorCountdownTimer = null;
      }

      function startAcceleratorCountdown() {
        stopAcceleratorCountdown();
        if (!acceleratorCountdownRunning || acceleratorRemainingSeconds <= 0) return;
        acceleratorCountdownTimer = window.setInterval(function() {
          acceleratorRemainingSeconds = Math.max(0, acceleratorRemainingSeconds - 1);
          syncAcceleratorDuration();
          if (acceleratorRemainingSeconds === 0) {
            acceleratorCountdownRunning = false;
            stopAcceleratorCountdown();
            if (autoPauseUpgraded) renderAcceleratorActions(acceleratorActionsSlot);
          }
        }, 1000);
      }

      function setAcceleratorCountdownRunning(isRunning) {
        acceleratorCountdownRunning = Boolean(isRunning) && acceleratorRemainingSeconds > 0;
        if (acceleratorCountdownRunning) startAcceleratorCountdown();
        else stopAcceleratorCountdown();
      }

      function autoPauseRequirementsMet() {

        content.replaceChildren();

        intro.appendChild(introDescription);
        intro.appendChild(introNotice);
        content.appendChild(intro);

        const list = document.createElement('div');
        list.className = 'personal-center-auto-pause-requirements';
        autoPauseRequirements.forEach(function(requirement) {
          const row = document.createElement('div');
          row.className = 'personal-center-auto-pause-requirement' + (
            autoPauseChecking ? ' is-checking' : requirement.met ? ' is-success' : ''
          );

          const icon = document.createElement('i');
          icon.className = 'nnicon personal-center-auto-pause-requirement__icon ' + (
            autoPauseChecking
              ? 'nicon-a-loadingjiazai'
              : requirement.met
                ? 'nicon-a-check-linewancheng-xianxing'
                : 'nicon-a-warning-lineweixianjingshi-xianxing'
          );
          icon.setAttribute('aria-hidden', 'true');

          const copy = document.createElement('div');
          copy.className = 'personal-center-auto-pause-requirement__copy';
          const title = document.createElement('strong');
          title.className = 'personal-center-auto-pause-requirement__title';
          title.textContent = requirement.title;
          const description = document.createElement('p');
          description.className = 'personal-center-auto-pause-requirement__description';
          description.textContent = requirement.description;
          copy.appendChild(title);
          copy.appendChild(description);

          const control = document.createElement('div');
          control.className = 'personal-center-auto-pause-requirement__control';
          const status = document.createElement('span');
          status.className = 'personal-center-auto-pause-requirement__status';
          status.textContent = autoPauseChecking ? '检测中' : requirement.met ? '符合要求' : '待处理';
          control.appendChild(status);
          if (!autoPauseChecking && !requirement.met) {
            control.appendChild(createButton({
              text: requirement.actionText,
              variant: 'system',

          row.appendChild(copy);
          row.appendChild(control);
          list.appendChild(row);
        });
        content.appendChild(list);

        const ready = autoPauseRequirementsMet();
        if (ready && !autoPauseChecking) {

      function openAutoPauseUpgradeModal(trigger) {
        closeAutoPauseModal();
        autoPauseTrigger = trigger || null;

        const overlay = document.createElement('div');
        overlay.className = 'personal-center-auto-pause-modal';
        const modalContent = document.createElement('div');
        modalContent.className = 'personal-center-auto-pause-content';
        let dialog = null;
        let completeButton = null;
        let detectButton = null;

        function runDetection() {
          if (autoPauseChecking) return;
          autoPauseChecking = true;
          if (detectButton) {
            detectButton.disabled = true;
            detectButton.setButtonText('检测中');
          }
          renderAutoPauseRequirements(modalContent, completeButton);
          window.setTimeout(function() {
            if (!overlay.isConnected) return;
            autoPauseRequirements.forEach(function(requirement) {
              requirement.met = true;
            });
            autoPauseChecking = false;
            if (detectButton) {
              detectButton.disabled = false;
              detectButton.setButtonText('重新检测');
            }
            renderAutoPauseRequirements(modalContent, completeButton);
          }, 650);
        }

        function completeUpgrade() {
          if (!autoPauseRequirementsMet() || autoPauseChecking) return;
          autoPauseUpgraded = true;
          setAcceleratorCountdownRunning(false);
          closeAutoPauseModal();
          renderAcceleratorActions(acceleratorActionsSlot);
          if (typeof showMessage === 'function') {
            showMessage({
              state: 'success',
              text: '已切换到时长自动暂停模式',
              mountTarget: framework
            });
          }
        }

        dialog = createToast({
          title: '升级自动暂停',
          subtitle: '检测并完成以下条件',
          content: modalContent,
          showFooter: true,
          footer: {
            layout: 'double-horizontal',
            buttons: [
              {
                text: '重新检测',
                variant: 'system',
                level: 'secondary',
                size: 'large',
                className: 'personal-center-auto-pause-detect-button',
                onClick: runDetection
              },
              {
                text: '完成升级',
                variant: 'primary',
                level: 'primary',
                size: 'large',
                disabled: true,
                className: 'personal-center-auto-pause-complete-button',
                onClick: completeUpgrade
              }
            ]
          },
          className: 'personal-center-auto-pause-dialog',
          onClose: closeAutoPauseModal
        });
        dialog.setAttribute('role', 'dialog');
        dialog.setAttribute('aria-modal', 'true');
        dialog.setAttribute('aria-labelledby', 'personal-center-auto-pause-title');
        const title = dialog.querySelector('.nn-toast__title');
        if (title) title.id = 'personal-center-auto-pause-title';
        const closeButton = dialog.querySelector('.nn-toast__close');
        if (closeButton) closeButton.setAttribute('aria-label', '关闭升级自动暂停');
        completeButton = dialog.querySelector('.personal-center-auto-pause-complete-button');
        detectButton = dialog.querySelector('.personal-center-auto-pause-detect-button');
        renderAutoPauseRequirements(modalContent, completeButton);

        overlay.appendChild(dialog);
        overlay.addEventListener('click', function(event) {
          if (event.target === overlay) closeAutoPauseModal();
        });
        framework.appendChild(overlay);
        autoPauseModal = overlay;
        document.addEventListener('keydown', handleAutoPauseKeydown);
        if (closeButton) closeButton.focus();
      }

      function renderOverviewCards(cards, slot) {
        if (!slot) return;
        cards.forEach(function(card) {
          const stat = document.createElement('article');
          stat.className = 'accelerator-asset-detail-stat personal-center-game-overview__stat' + (card.className ? ' ' + card.className : '');
          const rankDescription = card.ranks.map(function(rank) {
            return rank.scope + rank.value + rankTrendDescription(rank.delta);
          }).join('，');
          const valueDescription = Array.isArray(card.segments)
            ? card.segments.map(function(segment) { return segment.value + segment.unit; }).join('')
            : card.value + card.description;
          stat.setAttribute('aria-label', card.text + '，' + valueDescription + '，' + rankDescription);

      function topRankToneClass(value) {
        const normalizedRank = Number(String(value).replace(/[^0-9.-]/g, ''));
        if (normalizedRank === 1) return 'personal-center-rank-tone--first';
        if (normalizedRank === 2) return 'personal-center-rank-tone--second';
        if (normalizedRank === 3) return 'personal-center-rank-tone--third';
        return '';
      }

      function applyTopRankTone(element, value) {

      function getSteamDashboardCurrentUserRow(config, options) {
        const tableOptions = options || {};
        const rankingScope = tableOptions.scope || 'global';
        const scopeRank = config.scopeRanks && config.scopeRanks[rankingScope]
          ? config.scopeRanks[rankingScope]
          : { value: config.currentRank, delta: config.currentRankDelta };
        const regionIndex = Number.isFinite(tableOptions.regionIndex) ? tableOptions.regionIndex : 0;
        const regionRankOffset = rankingScope === 'province'
          ? regionIndex * 7
          : rankingScope === 'city'
            ? regionIndex * 3
            : 0;
        const account = activeSteamAccount();
        return {
          rank: String(Number(scopeRank.value) + regionRankOffset),
          rankDelta: scopeRank.delta,
          avatarSrc: account.avatarSrc,
          userName: account.userName,
          metric: config.currentValue + config.rankingUnit
        };
      }

      function renderSteamDashboardRankingTable(config, slots) {
        const rankingScope = slots.rankingScope || 'global';
        const isProvince = rankingScope === 'province';
        const isCity = rankingScope === 'city';
        const regionOptions = isProvince
          ? steamDashboardProvinceOptions
          : isCity
            ? steamDashboardCityOptions
            : [];
        const regionIndex = isProvince
          ? slots.provinceIndex
          : isCity
            ? slots.cityIndex
            : 0;
        const scopeItem = steamDashboardRankingScopes.find(function(item) {
          return item.key === rankingScope;
        });
        const selectedRegion = regionOptions[regionIndex];
        const scopeTitle = selectedRegion
          ? selectedRegion.label + '榜'
          : scopeItem
            ? scopeItem.name
            : '全球榜';
        const currentUserRow = getSteamDashboardCurrentUserRow(config, {
          scope: rankingScope,
          regionIndex: regionIndex
        });
        slots.currentCard.replaceChildren(createPersonalRankingCurrentCard(currentUserRow, 'metric'));
        slots.table.replaceChildren(createSteamDashboardRankingTable(config, {
          scope: rankingScope,
          scopeTitle: scopeTitle,
          regionIndex: regionIndex
        }));
        if (slots.rightScroller) slots.rightScroller.scrollTop = 0;
        requestAnimationFrame(function() {
          if (steamDashboardScrollbars[1]) steamDashboardScrollbars[1].update();
        });

        slots.leftTitle.textContent = config.sectionTitle;

          return {
            rank: String(index + 1),
            rankAsset: index < 3 ? '../image/rank/Ranking' + (index + 1) + '.png' : '',

            userName: profile.userName,
            playtime: (baseTime + 420 - index * 18.6).toFixed(1) + 'h'

        const account = activeSteamAccount();
        topRows.push({
          rank: String(currentRank),
          rankDelta: rankDelta,
          avatarSrc: account.avatarSrc,
          userName: account.userName,
          playtime: game.time + 'h'
        });

        const table = createTable({
          height: 760,
          rowHeight: 88,
          headerHeight: 40,
          minWidth: 0,
          stickyHeader: true,
          className: 'personal-center-game-library-table',
          columns: [
            {
              key: 'rank',
              title: '排名',
              width: 72,
              align: 'center',
              render: function(value, row) {
                if (row.rankAsset) {
                  const badge = document.createElement('img');
                  badge.className = 'personal-center-game-ranking-badge';
                  badge.src = row.rankAsset;
                  badge.alt = '第' + value + '名';
                  return badge;
                }
                return createGameRankingNumberCell(value);
              }
            },
            {
              key: 'game',
              title: '游戏',
              width: '32%',
              render: createGameLibraryGameCell
            },
            {
              key: 'platforms',
              title: '平台',
              width: 80,
              render: createGameLibraryPlatformIcons
            },
            {
              key: 'playtime',
              title: '游戏时间',
              width: 104,
              align: 'right',
              render: createGameLibraryNumericValue
            },
            {
              key: 'globalRank',
              title: '全球排名',
              width: 112,
              render: function(value, row) {
                return createGameLibraryRankValue(value, row.rankDelta);
              }
            },
            { key: 'nationalRank', title: '全国排名', width: 112, render: createGameLibraryRankMetric },
            { key: 'provinceRank', title: '湖北省排名', width: 132, render: createGameLibraryRankMetric },
            { key: 'cityRank', title: '武汉市排名', width: 132, render: createGameLibraryRankMetric }
          ],
          data: tableRows
        });
        const tableRegion = table.querySelector('.nn-table');
        if (tableRegion) tableRegion.setAttribute('aria-label', '我的游戏排行数据');
        table.querySelectorAll('.nn-table__row').forEach(function(rowElement, index) {
          const row = tableRows[index];
          rowElement.tabIndex = 0;
          rowElement.setAttribute('role', 'button');
          rowElement.setAttribute('aria-label', row.title + '，查看游戏时间排行');
          rowElement.addEventListener('click', function() {
            openGameRankingModal(row.sourceGame, row.timeRank.value, rowElement, row.timeRank.delta, row.timeRank.ranks);
          });
          rowElement.addEventListener('keydown', function(event) {
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              rowElement.click();
            }
          });
        });
        return table;
      }

      function renderGameCollection() {
        recommendationsSlot.replaceChildren();
        recommendationsSlot.appendChild(createGameLibraryTable());
      }

      renderGameCollection();

      if (typeof createScrollbar === 'function') {
        contentScrollbar = createScrollbar({
          target: content,
          container: contentWrap,
          hoverTarget: contentWrap,
          variant: 'page',
          right: 4,
          minThumbSize: 60,
          className: 'personal-center-scrollbar'
        });
      }
    });
  </script>
</body>
</html>
